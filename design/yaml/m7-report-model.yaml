- id: REP-09
  name: 任务台账
  alias: rep09
  objectType: LIST_QUERY
  description: 列表（规格 5.10）。v1.1 起同一张台账承载两条来源：人工提交与交付门面受理，只差来源列与步骤编码列——不另建第二份任务事实。
  behaviorRef: FUNC-25
  sourceObjects:
  - objectRef: AGG-IGN-06
    alias: exectask
    primary: true
    sourceNote: 列表
  joins: []
  parameters:
  - name: p1
    label: 执行机 / 动作 / 集群 / 状态 / 时间
    dataType: String
    required: false
    allowedOperators:
    - EQ
    sourceField: ''
  - name: p2
    label: 来源任务标识（v1.1）
    dataType: String
    required: false
    allowedOperators:
    - EQ
    sourceField: ExecTask.sourceTaskNo
  conditions:
  - conditionId: C01
    leftExpression: 执行机 / 动作 / 集群 / 状态 / 时间
    operator: EQ
    parameterRef: p1
    logicalConnector: AND
    group: BASE
    skipWhenParameterEmpty: true
  - conditionId: C02
    leftExpression: ExecTask.sourceTaskNo
    operator: EQ
    parameterRef: p2
    logicalConnector: AND
    group: BASE
    skipWhenParameterEmpty: true
  resultColumns:
  - name: c1
    label: 任务编号
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c2
    label: 动作
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c3
    label: 步骤编码（v1.1，仅 ezctl.setup 有值）
    dataType: String
    sourceExpression: ExecTask.stepCode
    aggregateFunction: NONE
    sortable: true
  - name: c4
    label: 执行机
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c5
    label: 关联集群
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c6
    label: 来源任务标识 + 来源步骤序号（v1.1，非空即由门面受理）
    dataType: String
    sourceExpression: ExecTask.sourceTaskNo + ExecTask.sourceStepIndex
    aggregateFunction: NONE
    sortable: true
  - name: c7
    label: 状态
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c8
    label: 结论依据（v1.1）
    dataType: String
    sourceExpression: ExecTask.verdictSource
    aggregateFunction: NONE
    sortable: true
  - name: c9
    label: 对账注记（v1.1，是否被修正过）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c10
    label: 退出码 / 失败原因
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c11
    label: 起止时间
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  groupBy: []
  having: []
  orderBy: []
  pagination:
    enabled: true
    defaultPageSize: 20
    maxPageSize: 100
  reportOptions: null
  version: '1.1'
  caliberNote: 口径注记（v1.1）：FAILED / CANCELLED / LOST 三态分列，LOST 一律不并入失败（并列就等于把"不知道"说成"做坏了"）；LOST 行的退出码位为空（INV-37）；状态 + 结论依据 + 对账注记三件同现即口径 7「状态可信来源标注」在台账层的落点；来源列只读、无输入位（INV-34）
- id: REP-10
  name: 任务详情
  alias: rep10
  objectType: DETAIL_QUERY
  description: 明细（规格 5.11）。分区呈现：提交信息 ｜ 动作与参数 ｜ 执行结果 ｜ 对账注记 ｜ 日志游标右界与行数（v1.1 末区）。
  behaviorRef: FUNC-26
  sourceObjects:
  - objectRef: AGG-IGN-06
    alias: exectask
    primary: true
  joins: []
  parameters:
  - name: p1
    label: 任务编号
    dataType: String
    required: true
    allowedOperators:
    - EQ
    sourceField: ExecTask.taskNo
  conditions:
  - conditionId: C01
    leftExpression: ExecTask.taskNo
    operator: EQ
    parameterRef: p1
    logicalConnector: AND
    group: BASE
  resultColumns:
  - name: c1
    label: 提交信息（含来源标识与提交身份，v1.1）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c2
    label: 动作与参数（环境变量值脱敏）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c3
    label: 执行结果（退出码 + 结论依据 + 结论摘要，v1.1）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c4
    label: 对账注记（是否被修正过）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c5
    label: 日志游标右界与行数（v1.1）
    dataType: String
    sourceExpression: TaskLogLine 聚合派生
    aggregateFunction: COUNT
    sortable: false
  groupBy: []
  having: []
  orderBy: []
  pagination:
    enabled: false
    defaultPageSize: 0
    maxPageSize: 0
  reportOptions: null
  version: '1.1'
  caliberNote: 口径注记（v1.1）：被对账修正过的任务必须显示修正痕迹（例外路径可审计，R-09 的界面落点）；LOST 任务显示「痕迹不可存活」原因、退出码位为空（INV-37）；环境变量值不出现在任何界面与接口回显（Q-22）；来源标识与提交身份只读、非空即由门面受理（INV-34）
- id: REP-11
  name: 任务日志视图
  alias: rep11
  objectType: DETAIL_QUERY
  description: 流式明细（规格 5.12）。v1.1 起数据源是本域的子实体数据行 TaskLogLine（表 ign_task_log）——界面与门面回吐读的是同一份已脱敏存储，不存在第二份日志副本。
  behaviorRef: FUNC-27
  sourceObjects:
  - objectRef: AGG-IGN-06
    alias: exectask
    primary: true
    sourceNote: 明细（流式）；数据源为任务聚合内子实体任务日志行（表 ign_task_log），按行游标升序
  joins: []
  parameters:
  - name: p1
    label: 任务编号
    dataType: String
    required: true
    allowedOperators:
    - EQ
    sourceField: ExecTask.taskNo
  - name: p2
    label: 游标起点（增量续传，缺省最近 500 行）
    dataType: Integer
    required: false
    allowedOperators:
    - GT
    sourceField: TaskLogLine.seq
  conditions:
  - conditionId: C01
    leftExpression: ExecTask.taskNo
    operator: EQ
    parameterRef: p1
    logicalConnector: AND
    group: BASE
  - conditionId: C02
    leftExpression: TaskLogLine.seq
    operator: GT
    parameterRef: p2
    logicalConnector: AND
    group: BASE
    skipWhenParameterEmpty: true
  resultColumns:
  - name: c1
    label: 行游标
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c2
    label: 时间
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c3
    label: 流向（v1.1 含「工具输出」）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: true
  - name: c4
    label: 日志行（已脱敏内容）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c5
    label: 已脱敏标记（v1.1）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  - name: c6
    label: 结束事件（含 exit / 判定依据 / 完整性注记）
    dataType: String
    sourceExpression: ''
    aggregateFunction: NONE
    sortable: false
  groupBy: []
  having: []
  orderBy:
  - expression: TaskLogLine.seq
    direction: ASC
  pagination:
    enabled: true
    defaultPageSize: 500
    maxPageSize: 2000
  reportOptions: null
  version: '1.1'
