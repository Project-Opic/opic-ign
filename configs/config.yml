# opic-techbase 配置(环境变量可覆盖,优先级 env > yaml > 默认;见 .env.example)
app:
  name: opic-ignition-center
  port: "9709"

log:
  level: info
  output: std    # std|file(file 时写 dir/opic-techbase.log,按大小轮转)
  dir: ./log

# 数据库:PostgreSQL 16(Pigsty 生产集群 haproxy 5433 rw;库=opicdb,中心专属 schema 见 OPIC-DB-SCHEMA-01)
# 本仓为点火中心(ignition-center):schema=ign(OPIC-DB-SCHEMA-01);本地开发可连 docker-compose.infra.yml 栈
database:
  host: 192.168.3.200
  port: 5433
  username: postgres
  password: postgres
  dbname: opicdb
  schema: ign
  sslmode: disable
  maxconns: 20
  minconns: 5

# Redis(step1 生产:opic-redis 容器,宿主回环 26379;口令见生产 .env)
redis:
  enabled: true
  host: 192.168.3.200
  port: 26379
  password: ""
  db: 0

# ── 中心标识（隔离三件套的根，OPIC-TECH-01 v1.1）──────────────────────────────
# fork 后改为本中心域码（小写，如 osec）——picdb schema/Temporal TaskQueue/NATS stream+主题全部随之隔离
center_code: ign

# 事件总线(step1 NATS JetStream;容器网 nats:4222 / 宿主 14222;口令见生产 .env)
# driver=inproc 为零依赖默认(开发/降级);生产切 nats
# stream_name/subject_prefix 留空 = 按 center_code 派生（OPIC_<CODE> / opic.<code>.>）
eventbus:
  driver: inproc
  url: nats://192.168.3.200:14222
  username: opic
  password: ""
  stream_name: "ign"           # 平台口径(用户 2026-10-05 裁定):NATS 流 = 中心 3 位小写同名码,与 schema/队列同名
  subject_prefix: "opic.ign."  # 显式声明(infra 自动补 ".>";留空=按 center_code 派生 opic.ign.>)
  max_age_days: 7

# 工作流(step1 Temporal;容器网 temporal:7233 / 宿主 7233;业务命名空间 opic)
# driver=local 为零依赖默认;生产切 temporal;task_queue 留空 = center_code
workflow:
  driver: local
  address: 192.168.3.200:7233
  namespace: opic
  task_queue: "ign"            # 显式声明(留空=按 center_code 派生 ign)

# Prometheus 指标(/metrics;env METRICS_ENABLED 可覆盖)
metrics:
  enabled: true

# 身份认证:OPIC-零信任安全中心集成的 ZITADEL
# mode=local     本地账号密码登录(开发/单机回退,HS256 会话)
# mode=zitadel   OIDC Authorization Code + PKCE;JWKS 验签;角色声明映射本地角色
auth:
  mode: local
  jwt_secret: go-techbase-dev-secret
  jwt_expires_hours: 12
  allow_local_login: true
  issuer: http://localhost:8080        # ZITADEL 地址(零信任中心 docker-compose)
  client_id: go-techbase
  client_secret: ""
  redirect_url: http://localhost:9680/api/auth/callback
  role_claim: roles                     # ZITADEL 项目角色声明名
  auto_provision: true                  # 按 userinfo 自动建用户
  default_role_codes: IGN-ROLE-04        # 自动 provisioning 兜底角色(交付只读用户)

# 七模型本体 YAML 目录(默认随底座 models/,应用项目可指向自己的 models/)
ontology:
  models_dir: models

# 前端构建产物目录(空则不托管;开发期前端走 vite proxy;compose 走网关/nginx)
frontend:
  dist_dir: ""

# ── 本机执行位与交付门面(v1.1;需求文档 1.6.1 / 《编制说明》C.3.3)──────────────
# 三条纪律:① 路径与可执行文件只以本段配置值(或同名 env)存在——不进代码常量、不进字典、
#    界面只读不可维护;② tool_bin 为空或不可执行 ⇒ 本机执行位不可用 ⇒ 门面受理即刻拒绝并记
#    TOOL_UNAVAILABLE(R-15),绝不静默改走别的执行位;③ 动作码→argv 的映射是本域私有事实,
#    门面对上游只暴露动作码与结论。
# 容器挂载三件:tool_root(只读发行包)/ ssh_dir(宿主免密私钥)/ work_dir(可写 clusters/<标识>/)。
# env 覆盖名:IGN_DELIVERY_TOOL_BIN / _TOOL_ROOT / _WORK_DIR / _FACADE_TOKEN / _FACADE_USER / _SSH_DIR
delivery:
  tool_bin: ""       # 例 /opt/opic/delivery/bin/ezctl(由 apps/<center>/.env 提供)
  tool_root: ""      # 例 /etc/kubeasz
  work_dir: ""       # 缺省 = tool_root
  facade_token: ""   # 上游中心(O-CLC)服务身份令牌;空 ⇒ 门面三接口一律 401
  facade_user: ignition-agent
  ssh_dir: ""        # 例 /root/.ssh(内容零出口,只透传路径)

