model_type: UI
version: '1.1.1'
domain: 交付执行域
application:
  name: OPIC-交付执行域
  menus:
  - menuId: menu-l1-01
    name: 交付管理
    children:
    - menuId: menu-ign-version
      name: 版本目录
      screenRef: frmIgnVersion
    - menuId: menu-ign-image
      name: 发行包与镜像
      screenRef: frmIgnImage
    - menuId: menu-ign-executor
      name: 执行机
      screenRef: frmIgnExecutor
    - menuId: menu-ign-tls
      name: 通道安全
      screenRef: frmIgnTls
    - menuId: menu-ign-task
      name: 任务桥接
      screenRef: frmIgnTask
    - menuId: menu-ign-log
      name: 日志与对账
      screenRef: frmIgnLog
  - menuId: menu-l1-02
    name: 运行观测
    children:
    - menuId: menu-ign-ops
      name: 运行观测
      screenRef: frmIgnOps
screens:
- screenId: frmIgnVersion
  name: 版本列表维护
  screenType: LIST_MAINTENANCE
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 编排引擎版本
    io: I
    required: false
    dataBinding: DeliveryVersion.orchestratorVersion
  - id: el02
    type: SELECT
    label: 版本状态
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 版本登记（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 版本编号
    io: O
    required: false
    dataBinding: DeliveryVersion
  - id: el05
    type: TEXT
    label: 版本名
    io: O
    required: false
    dataBinding: DeliveryVersion
  - id: el06
    type: TEXT
    label: 组件版本组（契约，上架后冻结）
    io: O
    required: false
    dataBinding: 组件版本组六项
  - id: el07
    type: TEXT
    label: 预推汇总
    io: O
    required: false
    dataBinding: ImagePrepushItem 聚合
  - id: el08
    type: BUTTON
    label: 断点续推（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-01
    name: 版本登记
    actionType: OTHER
    behaviorRef: FUNC-01
    permissionRef:
    - PERM-FUNC-01
  - actionId: act-FUNC-02
    name: 版本登记信息修改
    actionType: OTHER
    behaviorRef: FUNC-02
    permissionRef:
    - PERM-FUNC-02
  - actionId: act-FUNC-03
    name: 触发发行包下载
    actionType: OTHER
    behaviorRef: FUNC-03
    permissionRef:
    - PERM-FUNC-03
  - actionId: act-FUNC-04
    name: 版本归档
    actionType: OTHER
    behaviorRef: FUNC-04
    permissionRef:
    - PERM-FUNC-04
  - actionId: act-FUNC-05
    name: 版本软删除
    actionType: OTHER
    behaviorRef: FUNC-05
    permissionRef:
    - PERM-FUNC-05
  - actionId: act-FUNC-06
    name: 版本列表查询
    actionType: QUERY
    behaviorRef: FUNC-06
    permissionRef:
    - PERM-FUNC-06
  - actionId: act-FUNC-07
    name: 版本详情查询（含镜像清单与预推状态）
    actionType: QUERY
    behaviorRef: FUNC-07
    permissionRef:
    - PERM-FUNC-07
- screenId: frmIgnImage
  name: 发行包与预推台
  screenType: LIST_MAINTENANCE
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 版本
    io: I
    required: false
    dataBinding: DeliveryVersion
  - id: el02
    type: SELECT
