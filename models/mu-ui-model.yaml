    dataBinding: ''
  actions:
  - actionId: act-FUNC-20
    name: 手动触发证书续期
    actionType: OTHER
    behaviorRef: FUNC-20
    permissionRef:
    - PERM-FUNC-20
  - actionId: act-FUNC-21
    name: TLS 显式降级声明（实验环境）
    actionType: OTHER
    behaviorRef: FUNC-21
    permissionRef:
    - PERM-FUNC-21
  - actionId: act-FUNC-22
    name: 证书绑定清单查询（含临期视图）
    actionType: QUERY
    behaviorRef: FUNC-22
    permissionRef:
    - PERM-FUNC-22
- screenId: frmIgnTask
  name: 任务提交与台账
  screenType: MASTER_DETAIL_FORM
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 执行机
    io: I
    required: true
    dataBinding: Executor 筛选
    role: QUERY
    valueNote: v1.1 只列「就绪 + 未超载 + 健康」项，LOCAL 执行位置顶；TOOL_UNAVAILABLE 时在下方原因位给出「本机执行位不可用：命令面挂载缺失」，不静默置灰（R-15）
  - id: el02
    type: SELECT
    label: 执行动作
    io: I
    required: true
    dataBinding: ''
    role: QUERY
    valueNote: 字典 IGN_ACTION（白名单，INV-28 / R-12）
  - id: el03
    type: TEXTBOX
    label: 动作参数
    io: I
    required: true
    dataBinding: ExecTask.args
    valueNote: 结构化独立 argv、无 shell 解释；人工路径保留输入位，门面路径无此位（R-13 派生）
  - id: el04
    type: REF_SELECT
    label: 关联集群
    io: I
    required: true
    dataBinding: ExecTask.clusterRef
    valueNote: 跨域引用 O-CLC（INV-33），跳选框
  - id: el05
    type: NUMBER
    label: 超时秒数
    io: I
    required: true
    dataBinding: ExecTask.timeoutSeconds
    valueNote: 缺省取平台配置（REF-02）
  - id: el06
    type: BUTTON
    label: 提交（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el07
    type: BUTTON
    label: 取消执行任务（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el08
    type: TEXT
    label: 环境变量
    io: O
    required: false
    dataBinding: ExecTask.env
  - id: el09
    type: TEXT
    label: 状态 + 结论依据 + 对账注记（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: LOST 用「痕迹不可存活」中性色且退出码位为空（INV-37）；经对账修正的任务显示修正痕迹（口径 7）
  - id: el10
    type: SELECT
    label: 步骤编码（v1.1）
    io: I
    required: false
    dataBinding: ExecTask.stepCode
    valueNote: 条件必填——仅 ezctl.setup 可见且必填，取字典 IGN_INSTALL_STEP（01~07，INV-36）；其余动作隐藏并置空
  - id: el11
    type: TEXT
    label: 来源任务标识 + 来源步骤序号（v1.1）
    io: O
    required: false
    dataBinding: ExecTask.sourceTaskNo / sourceStepIndex
    valueNote: 只读列、无输入位（INV-34）；非空即「由门面受理」，点击进入门面受理台账反查（FUNC-37）
  - id: el12
    type: GRID
    label: 从表｜任务日志行（v1.1，只读）
    io: O
    required: false
    dataBinding: ExecTask.logs
    dataSource: REP-11
    valueNote: 行游标 / 时间 / 流向（含工具输出）/ 内容 / 已脱敏标记；游标空洞显式标注（INV-38）；按游标增量拉取、不提供导出（口径 5）
  actions:
  - actionId: act-FUNC-23
    name: 提交执行任务
    actionType: DRAFT
    behaviorRef: FUNC-23
    permissionRef:
    - PERM-FUNC-23
  - actionId: act-FUNC-24
    name: 取消执行任务
    actionType: OTHER
    behaviorRef: FUNC-24
    permissionRef:
    - PERM-FUNC-24
- screenId: frmIgnLog
  name: 日志与对账台
  screenType: QUERY_LIST
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 任务
    io: I
    required: false
    dataBinding: ExecTask.taskNo
  - id: el02
    type: TEXT
    label: 时间
    io: O
    required: false
    dataBinding: 日志通道
  - id: el03
    type: TEXT
    label: 流向
    io: O
    required: false
    dataBinding: 日志通道
  - id: el04
    type: TEXT
    label: 日志行
    io: O
    required: false
    dataBinding: 日志通道
    valueNote: v1.1 改绑子实体 TaskLogLine.logLine（本域唯一的日志存储，界面与门面回读同源同脱敏，INV-40）
  - id: el05
    type: TAB
    label: 对账与纠偏（页签）
    io: I
    required: false
    dataBinding: 纠偏记录
  - id: el06
    type: TEXT
    label: 状态 + 结论依据 + 对账修正（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: 结论依据取 IGN_VERDICT_SOURCE（退出码 / 剧本汇总 / 代理回执 / 无法验真）；LOST 落「痕迹不可存活」且退出码位为空（INV-37）
  - id: el07
    type: TEXT
    label: 行游标（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.seq
    valueNote: 单调递增、空洞显式标注为「少了几行」（INV-38）；与主表「游标右界」列同坐标——上游回读用的与界面看到的是同一个
  - id: el08
    type: TEXT
    label: 已脱敏标记（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.masked
    valueNote: 命中掩码规则被改写的行标出「日志被动过」，而非静默替换（R-16）
  - id: el09
    type: TAB
    label: 门面受理台账（页签，v1.1）
    io: O
    required: false
    dataBinding: ExecTask（固定过滤来源任务标识非空）
    dataSource: REP-14
    valueNote: 来源任务标识 + 来源步骤序号 / 结论依据 / 日志行数与游标右界；对四个界面角色开放（不含参数与命令面，敏感级低于纠偏页签）；默认「来源非空 + 最近 7 天」
  actions:
  - actionId: act-FUNC-25
    name: 任务台账查询
    actionType: QUERY
    behaviorRef: FUNC-25
    permissionRef:
    - PERM-FUNC-25
  - actionId: act-FUNC-26
    name: 任务详情查询
    actionType: QUERY
    behaviorRef: FUNC-26
    permissionRef:
    - PERM-FUNC-26
  - actionId: act-FUNC-27
    name: 任务日志查询（中继回流视图）
    actionType: QUERY
    behaviorRef: FUNC-27
    permissionRef:
    - PERM-FUNC-27
  - actionId: act-FUNC-28
    name: 对账与纠偏台账查询
    actionType: QUERY
    behaviorRef: FUNC-28
    permissionRef:
    - PERM-FUNC-28
  - actionId: act-FUNC-37
    name: 门面受理台账查询
    actionType: QUERY
    behaviorRef: FUNC-37
    permissionRef:
    - PERM-FUNC-37
- screenId: frmIgnOps
  name: 统计与参数
  screenType: QUERY_LIST
  layout: ''
  elements:
  - id: el01
    type: TEXT
    label: 版本数
    io: O
    required: false
    dataBinding: DeliveryVersion 聚合
  - id: el02
    type: TEXT
    label: 可用版本
    io: O
    required: false
    dataBinding: DeliveryVersion 聚合
  - id: el03
    type: TEXT
    label: 执行机就绪
    io: O
    required: false
    dataBinding: Executor 聚合
  - id: el04
    type: TEXT
    label: 不可达
    io: O
    required: false
    dataBinding: Executor 聚合
  - id: el05
    type: TEXT
    label: 任务 7 日成功
    io: O
    required: false
    dataBinding: ExecTask 聚合
  - id: el06
    type: TEXT
    label: 纠偏次数
    io: O
    required: false
    dataBinding: 纠偏记录
  - id: el07
    type: TEXTBOX
    label: 任务默认超时（秒）
    io: I
    required: false
    dataBinding: O-SYS 配置
    valueNote: REF-02
  - id: el08
    type: TEXTBOX
    label: 心跳超时阈值（秒）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-03
  - id: el09
    type: TEXTBOX
    label: 引导令牌有效期（秒）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-01
  - id: el10
    type: BUTTON
    label: 保存运行参数（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el11
    type: TEXT
    label: 门面受理 7 日（v1.1）
    io: O
    required: false
    dataBinding: ExecTask 聚合
    valueNote: 来源任务标识非空的任务数，与人工提交量分列（台账事实块）
  - id: el12
    type: TEXT
    label: 痕迹不可存活 LOST（v1.1）
    io: O
    required: false
    dataBinding: ExecTask 聚合
    valueNote: 独立成卡、不并入失败计数（INV-37；与任务成败计数卡视觉分列）
  - id: el13
    type: TEXT
    label: 执行位可用（v1.1）
    io: O
    required: false
    dataBinding: 系统探测（非台账）
    valueNote: 命令面挂载与可执行文件探测结果 + 扫描时间（R-15 的观测侧）；不可用时显示原因，不只置灰
  - id: el14
    type: TEXTBOX
    label: 回执单次回吐行数（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-14
  - id: el15
    type: TEXTBOX
    label: 终止宽限（秒）（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-15；进程组终止链的 SIGTERM→SIGKILL 宽限
  - id: el16
    type: TEXTBOX
    label: 日志保留天数（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-16；清理由系统执行，界面不提供手工清理位
  - id: el17
    type: TEXT
    label: 执行位命令面挂载路径（v1.1）
    io: O
    required: false
    dataBinding: 部署配置
    valueNote: 只读显示——不在可维护参数内（§1.6.1：部署配置值、运行期不可改）；改它走部署、不走界面
  - id: el18
    type: TEXTBOX
    label: Service 网段（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-17；只校验 CIDR 形态（与节点网络是否重叠属部署侧事实、不校验）；形态不合法即受理拒绝，不静默回落
  - id: el19
    type: TEXTBOX
    label: Pod 网段（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-18；同上，只校验 CIDR 形态
  - id: el20
    type: TEXTBOX
    label: 集群 DNS 后缀（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-19；改写它必须重签访问凭据（服务域名与证书域名形态随之变化）
  - id: el21
    type: TEXTBOX
    label: 容器网络插件（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-20；交付版本登记了插件时以版本登记为准（缺省面被版本派生覆盖）
  - id: el22
    type: TEXTBOX
    label: 容器运行时（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-21；枚举 containerd / docker，枚举外值受理拒绝
  - id: el23
    type: TEXTBOX
    label: 服务代理模式（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-22；枚举 iptables / ipvs / nftables，枚举外值受理拒绝
  - id: el24
    type: TEXTBOX
    label: 节点端口区间（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-23；「起始-结束」形态
  - id: el25
    type: TEXTBOX
    label: 取源方式（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-24；枚举 online / offline，offline 即只用预推与缓存、不出网
  - id: el26
    type: TEXTBOX
    label: 内网镜像仓库地址（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-25；空即不改写仓库相关键（写空串等于把发行包默认仓库覆盖成非法值）
  actions:
  - actionId: act-FUNC-29
    name: 统计总览查询
    actionType: QUERY
    behaviorRef: FUNC-29
    permissionRef:
    - PERM-FUNC-29
  - actionId: act-FUNC-30
    name: 运行参数维护
    actionType: OTHER
    behaviorRef: FUNC-30
    permissionRef:
    - PERM-FUNC-30
