  description: 被引用不可删 —— 引用来源两类：① 上游 O-CLC 集群模板登记的参数面模板标识（跨域只存标识、由上游声明，本域不直查他域表，与 R-01 同族同手法）；② 本域内生效态覆写所依据的模板行（同域可直接查）。删除为软删除、拒绝时必须列出引用出处；停用不回收覆写（停用是「不再被新集群选中」，不是「已生效的取值作废」）｜读上游引用声明 + ClusterConfigOverride；写 IgnParamTemplate.templateStatus / 删除标记｜仅提交时强制
