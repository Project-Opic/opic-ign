    permissionRef:
    - PERM-FUNC-22
- screenId: frmIgnTask
  name: 任务提交与台账
  screenType: MASTER_DETAIL_FORM
  hostedIn: frmIgnClusterConsole
  tabName: 任务
  carrierNote: v1.5 载体置换 + 双挂点（Q-129 / Q-133）—— 本屏起有两处出现：① 「交付任务」叶的横看形态（跨集群台账 + 派发入口，第二签挂 frmIgnLog）；② 集群交付台的「任务」页签（嵌入态，clusterRef 由台上下文注入为只读过滤条件、该筛选器在嵌入态不渲染，横看态照常渲染）。两处是同一屏定义的两个挂点，权限档一致（IGN-ROLE-04 两处同关）。本屏自身同时升格为宿主屏（任务台账 ｜ 日志与对账两签），且仍保留自己的菜单叶（9.5 载体注记）
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 执行机
    io: I
    required: true
    dataBinding: Executor 筛选
    role: QUERY
    valueNote: v1.1 只列「就绪 + 未超载 + 健康」项，LOCAL 执行位置顶；TOOL_UNAVAILABLE 时在下方原因位给出「本机执行位不可用：命令面挂载缺失」，不静默置灰（R-15）
  - id: el02
    type: SELECT
    label: 执行动作
    io: I
    required: true
    dataBinding: ''
    role: QUERY
    valueNote: 字典 IGN_ACTION（白名单，INV-28 / R-12）
  - id: el03
    type: TEXTBOX
    label: 动作参数
    io: I
    required: true
    dataBinding: ExecTask.args
    valueNote: 结构化独立 argv、无 shell 解释；人工路径保留输入位，门面路径无此位（R-13 派生）
  - id: el04
    type: REF_SELECT
    label: 关联集群
    io: I
    required: true
    dataBinding: ExecTask.clusterRef
    valueNote: 跨域引用 O-CLC（INV-33），跳选框
  - id: el05
    type: NUMBER
    label: 超时秒数
    io: I
    required: true
    dataBinding: ExecTask.timeoutSeconds
    valueNote: 缺省取平台配置（REF-02）
  - id: el06
    type: BUTTON
    label: 提交（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el07
    type: BUTTON
    label: 取消执行任务（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el08
    type: TEXT
    label: 环境变量
    io: O
    required: false
    dataBinding: ExecTask.env
  - id: el09
    type: TEXT
    label: 状态 + 结论依据 + 对账注记（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: LOST 用「痕迹不可存活」中性色且退出码位为空（INV-37）；经对账修正的任务显示修正痕迹（口径 7）
  - id: el10
    type: SELECT
    label: 步骤编码（v1.1）
    io: I
    required: false
    dataBinding: ExecTask.stepCode
    valueNote: 条件必填——仅 ezctl.setup 可见且必填，取字典 IGN_INSTALL_STEP（01~07，INV-36）；其余动作隐藏并置空
  - id: el11
    type: TEXT
    label: 来源任务标识 + 来源步骤序号（v1.1）
    io: O
    required: false
    dataBinding: ExecTask.sourceTaskNo / sourceStepIndex
    valueNote: 只读列、无输入位（INV-34）；非空即「由门面受理」，点击进入门面受理台账反查（FUNC-37）
  - id: el12
    type: GRID
    label: 从表｜任务日志行（v1.1，只读）
    io: O
    required: false
    dataBinding: ExecTask.logs
    dataSource: REP-11
    valueNote: 行游标 / 时间 / 流向（含工具输出）/ 内容 / 已脱敏标记；游标空洞显式标注（INV-38）；按游标增量拉取、不提供导出（口径 5）
  actions:
  - actionId: act-FUNC-23
    name: 提交执行任务
    actionType: DRAFT
    behaviorRef: FUNC-23
    permissionRef:
    - PERM-FUNC-23
  - actionId: act-FUNC-24
    name: 取消执行任务
    actionType: OTHER
    behaviorRef: FUNC-24
    permissionRef:
    - PERM-FUNC-24
- screenId: frmIgnLog
  name: 日志与对账台
  screenType: QUERY_LIST
  hostedIn:
  - frmIgnTask
  - frmIgnClusterConsole
  tabName: 日志与对账
  carrierNote: v1.5 载体置换（Q-129，本域唯一一屏两宿主）—— 退出侧栏二级叶、屏定义与元素表未变，屏内三页签（日志 / 纠偏 / 门面台账）内部结构也未变，v1.5 只把外层入口从二级菜单换成页签。两处挂点差的是过滤上下文：台内挂点带 clusterRef（该集群的日志与偏差），横看挂点不带；三页签在两种形态下都用同一套 REP-11 ~ REP-14 查询面，不复制第二份报表绑定。IGN-ROLE-04 在两处均可见本屏（这是它在本域的主要工作面，8.3.2 ③）（9.6 载体注记）
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 任务
    io: I
    required: false
    dataBinding: ExecTask.taskNo
  - id: el02
    type: TEXT
    label: 时间
    io: O
    required: false
    dataBinding: 日志通道
  - id: el03
    type: TEXT
    label: 流向
    io: O
    required: false
    dataBinding: 日志通道
  - id: el04
    type: TEXT
    label: 日志行
    io: O
    required: false
    dataBinding: 日志通道
    valueNote: v1.1 改绑子实体 TaskLogLine.logLine（本域唯一的日志存储，界面与门面回读同源同脱敏，INV-40）
  - id: el05
    type: TAB
    label: 对账与纠偏（页签）
    io: I
    required: false
    dataBinding: 纠偏记录
  - id: el06
    type: TEXT
    label: 状态 + 结论依据 + 对账修正（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: 结论依据取 IGN_VERDICT_SOURCE（退出码 / 剧本汇总 / 代理回执 / 无法验真）；LOST 落「痕迹不可存活」且退出码位为空（INV-37）
  - id: el07
    type: TEXT
    label: 行游标（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.seq
    valueNote: 单调递增、空洞显式标注为「少了几行」（INV-38）；与主表「游标右界」列同坐标——上游回读用的与界面看到的是同一个
  - id: el08
    type: TEXT
    label: 已脱敏标记（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.masked
    valueNote: 命中掩码规则被改写的行标出「日志被动过」，而非静默替换（R-16）
  - id: el09
    type: TAB
    label: 门面受理台账（页签，v1.1）
    io: O
    required: false
    dataBinding: ExecTask（固定过滤来源任务标识非空）
    dataSource: REP-14
    valueNote: 来源任务标识 + 来源步骤序号 / 结论依据 / 日志行数与游标右界；对四个界面角色开放（不含参数与命令面，敏感级低于纠偏页签）；默认「来源非空 + 最近 7 天」
  actions:
  - actionId: act-FUNC-25
    name: 任务台账查询
    actionType: QUERY
    behaviorRef: FUNC-25
    permissionRef:
    - PERM-FUNC-25
  - actionId: act-FUNC-26
    name: 任务详情查询
    actionType: QUERY
    behaviorRef: FUNC-26
    permissionRef:
    - PERM-FUNC-26
  - actionId: act-FUNC-27
    name: 任务日志查询（中继回流视图）
    actionType: QUERY
    behaviorRef: FUNC-27
    permissionRef:
    - PERM-FUNC-27
  - actionId: act-FUNC-28
    name: 对账与纠偏台账查询
    actionType: QUERY
    behaviorRef: FUNC-28
    permissionRef:
    - PERM-FUNC-28
  - actionId: act-FUNC-37
    name: 门面受理台账查询
    actionType: QUERY
    behaviorRef: FUNC-37
    permissionRef:
    - PERM-FUNC-37
