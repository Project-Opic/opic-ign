    behaviorRef: FUNC-13
    permissionRef:
    - PERM-FUNC-13
  - actionId: act-FUNC-14
    name: 重新生成引导令牌（含锁定解锁）
    actionType: OTHER
    behaviorRef: FUNC-14
    permissionRef:
    - PERM-FUNC-14
  - actionId: act-FUNC-15
    name: 执行机注销（空闲）
    actionType: OTHER
    behaviorRef: FUNC-15
    permissionRef:
    - PERM-FUNC-15
  - actionId: act-FUNC-16
    name: 执行机能力标签调整
    actionType: OTHER
    behaviorRef: FUNC-16
    permissionRef:
    - PERM-FUNC-16
  - actionId: act-FUNC-17
    name: 执行机列表查询（含健康视图）
    actionType: QUERY
    behaviorRef: FUNC-17
    permissionRef:
    - PERM-FUNC-17
  - actionId: act-FUNC-18
    name: 执行机详情查询
    actionType: QUERY
    behaviorRef: FUNC-18
    permissionRef:
    - PERM-FUNC-18
  - actionId: act-FUNC-31
    name: 强制注销 · 提交申请
    actionType: DRAFT
    behaviorRef: FUNC-31
    permissionRef:
    - PERM-FUNC-31
  - actionId: act-FUNC-32
    name: 强制注销 · 通过
    actionType: OTHER
    behaviorRef: FUNC-32
    permissionRef:
    - PERM-FUNC-32
  - actionId: act-FUNC-33
    name: 强制注销 · 驳回
    actionType: OTHER
    behaviorRef: FUNC-33
    permissionRef:
    - PERM-FUNC-33
- screenId: frmIgnTls
  name: 通道安全台
  screenType: LIST_MAINTENANCE
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 执行机
    io: I
    required: false
    dataBinding: ExecutorTlsBinding.executorRef
  - id: el02
    type: SELECT
    label: 证书用途
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 临期视图（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 绑定编号
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el05
    type: TEXT
    label: 生效止
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el06
    type: TEXT
    label: 状态
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el07
    type: TEXT
    label: 凭据标识（跳转证书域）
    io: O
    required: false
    dataBinding: ExecutorTlsBinding.certRef
  - id: el08
    type: TEXT
    label: 剩余天数（即时计算）
    io: O
    required: false
