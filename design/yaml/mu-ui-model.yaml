- screenId: frmIgnClusterIndex
  name: 本域交付集群索引
  screenType: QUERY_LIST
  layout: v1.5 新增屏（Q-127）—— 查询列表形态，REP-19 的唯一呈现面，侧栏第一叶的工作起点；主栏 = 一行一集群标识的派生摘要表（列 = 集群标识 / 交付记录数 / 最近一次交付 / 已登记覆写字段 / 未决偏差 + 单一动作「进入集群交付台」），无表单区、无工具栏写动作。三条刻意的"不做"：不显示上游集群名称 / 生命周期状态 / 健康（INV-33）、不显示步骤 / 进度条 / 步进器（Q-69 裁定 ②，本表连"第几步"这一列都不存在）、不提供导出（元素表里的「导出」行是无控件项，故本屏不登记该元素 —— 与 REP-11 / REP-18 同族，5.20 ⑬）
  elements:
  - id: el01
    type: TEXTBOX
    label: 集群标识（筛选）
    io: I
    required: false
    dataBinding: ExecTask.clusterRef
    role: QUERY
    dataSource: REP-19
    valueNote: 前缀 / 包含匹配；不做存在性校验 —— 本域不持有集群有效性判据（INV-33）
  - id: el02
    type: SELECT
    label: 待办筛项
    io: I
    required: false
    dataBinding: ExecTask.clusterRef
    role: QUERY
    dataSource: REP-19
    valueNote: 四值：全部 / 有在跑任务 / 有生效覆写 / 有未决偏差；均为对本表既有列的过滤，不引入新查询面（9.10.2）
  - id: el03
    type: TEXT
    label: 集群标识（列）
    io: O
    required: false
    dataBinding: ExecTask.clusterRef
    dataSource: REP-19
    valueNote: 键集 = ExecTask.clusterRef ∪ ClusterConfigOverride.clusterRef 去重（REP-19 口径 ①）；可复制、点击进入台；不渲染上游名称（本域无此数据）
  - id: el04
    type: TEXT
    label: 交付记录数（列）
    io: O
    required: false
    dataBinding: ExecTask
    dataSource: REP-19
    valueNote: 按标识计数、含终态记录（口径 12：终态默认可见）
  - id: el05
    type: TEXT
    label: 最近一次交付（列）
    io: O
    required: false
    dataBinding: ExecTask
    dataSource: REP-19
    valueNote: 任务编号 + 结束时间 + 结果徽章，值域为任务状态字典；LOST 单列不并入失败（口径 7 / 5.20 ⑭）；点击跳台内「日志与对账」页签，与 REP-10 同源
  - id: el06
    type: TEXT
    label: 已登记覆写字段（列）
    io: O
    required: false
    dataBinding: ClusterConfigOverride
    dataSource: REP-19
    valueNote: ClusterConfigOverride 侧生效态计数；已回落的不计入但台内可见（避免"数字对不上"的疑问）
  - id: el07
    type: TEXT
    label: 未决偏差（列）
    io: O
    required: false
    dataBinding: ExecTask
    dataSource: REP-19
    valueNote: 该集群处于 LOST 或已发生状态修正的任务计数，由 ExecTask 的状态与结论依据列派生；逐笔纠偏明细不在本表、在台内「日志与对账」页签（REP-12 同源）；为 0 时显示 0 而非留空（口径 11：计数与观测视觉可分）
  - id: el08
    type: TEXT
    label: 统计时点标注
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-19
    valueNote: 必现，明示摘要为即时派生、非缓存（"摘要截至 …，进入台内以台内实时数据为准"）；不得读作"该集群现在的状态"
  - id: el09
    type: BUTTON
    label: 进入集群交付台（动作列）
    io: I
    required: false
    dataBinding: ''
    valueNote: 恒可见（可见性判据只有一条：该标识在本表出现过）；跳转携带 clusterRef 进 /ign/console/:clusterRef，台内缺省页签按 9.11.6 派生 —— 本列是路由出口、不是功能点，故不登记 action
  - id: el10
    type: TEXT
    label: 空态文案
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-19
    valueNote: 「本域尚未替任何集群执行过交付 —— 交付任务由上游中心派发或在本域「交付任务」叶提交」；不得写成"没有集群"（后者是上游的事实，本域无权断言）
  actions:
  - actionId: act-FUNC-52
    name: 本域交付集群索引查询
    actionType: QUERY
    behaviorRef: FUNC-52
    permissionRef:
    - PERM-FUNC-52
- screenId: frmIgnClusterConsole
  name: 集群交付台
  screenType: MASTER_DETAIL_FORM
  entryNote: v1.5 新增宿主屏（Q-127 / Q-130）—— 无菜单叶，由 frmIgnClusterIndex 行操作「进入集群交付台」经深链 /ign/console/:clusterRef 进入；主 = 一个集群在本域的头部徽章条，从 = 三页签组（落在既有四档形态里，不为新形态扩枚举）。宿主屏零新增语义：不新增功能点 / 报表 / 权限码 / 字典 / 规则（v1.5 新增的 FUNC-52 / REP-19 / PERM-FUNC-52 落在索引屏，不是本屏的新增物）
  layout: 以「这一个集群在本域交付执行的一生」为主体的主从表形态：三签 = 配置 ｜ 任务 ｜ 日志与对账（本域三种视角的并列，不是流程节点）；与 O-CLC 集群台的根本差别 —— 那边有「安装」步进器因为步进状态是其自有对象，本域只有任务与配置当前态，三签全部是读与治理视角，把步进器搬进来等于在本域复制一份上游状态机（同时违反 Q-69 与 INV-33）；缺省页签按 9.11.6 派生（有未决偏差 ⇒ 日志与对账；有在跑任务 ⇒ 任务；无在跑有生效覆写 ⇒ 配置；其余 ⇒ 配置），页签切换不重载徽章条
  elements:
  - id: el01
    type: TEXT
    label: 集群标识徽章
    io: O
    required: false
    dataBinding: ExecTask.clusterRef
    dataSource: REP-19
    valueNote: 进入即锁上下文（借 O-CLC 的 INV-32 手法，但本域没有那条 INV，靠台上下文与路由参数实现、不落不变式）
  - id: el02
    type: TEXT
    label: 派生摘要徽章（最近一次 / 在跑 / 生效覆写 / 未决偏差）
    io: O
    required: false
    dataBinding: ExecTask
    dataSource: REP-19
    valueNote: 只允许 REP-19 的派生值 + 标识本身；禁止出现上游集群属性、禁止"第 N 步"；右侧给「返回索引」（回 /ign/cluster，返回后整表重取，9.10.7 ①）
  - id: el03
    type: BUTTON
    label: 返回索引
    io: I
    required: false
    dataBinding: ''
    valueNote: 回 /ign/cluster（索引屏），返回后整表重取（9.10.7 ①）；路由出口、不是功能点，故不登记 action
  - id: el04
    type: TAB
    label: 页签组（配置 ｜ 任务 ｜ 日志与对账）
    io: I
    required: false
    dataBinding: ''
    valueNote: 按各自主数据权限码不渲染（8.3.2 ①：ign:FUNC-46 / ign:FUNC-23|25 / ign:FUNC-25）；缺位页签不出现在序列里；深链落进无权签 ⇒ 落回第一个有权签（8.3.2 ②），接口侧仍由各权限码把门
  - id: el05
    type: TEXT
    label: 配置页签主体
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-17
    valueNote: 回指 9.9.2（frmIgnConfig）全部元素，本表不复制一行；嵌入态下「集群标识」选择器不渲染、「文件面」选择器照常；原文视图（REP-18 / ign:FUNC-45）的登记位仍在 frmIgnConfig，随主体呈现在本签、本表不重复登记（Q-117 同判据：上移到台级的只有页签主体，独立发牌的原文腿不升格）
  - id: el06
    type: TEXT
    label: 任务页签主体
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-09
    valueNote: 回指 9.5.2（frmIgnTask，本域唯一"一屏两宿主"的横看/纵看双形态）；clusterRef 由上下文注入为只读过滤条件、不是可改的筛选器
  - id: el07
    type: TEXT
    label: 日志与对账页签主体
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-11
    valueNote: 回指 9.6.2（frmIgnLog，屏内三页签结构不变）；本集群 scope 的 REP-11 ~ REP-14 是同一报表的第二个呈现入口、不是新报表；FUNC-51 的跨中心日志腿不落在本域界面（它是给上游的通道）
  - id: el08
    type: BUTTON
    label: 集群上游信息出口
    io: I
    required: false
    dataBinding: ''
    valueNote: 需要看集群本身（名称 / 状态 / 节点）时一律跳转 O-CLC，不留副本、不做内嵌卡片（16 项范围外声明 + INV-33）—— 跨域路由出口，本域无对应功能点
