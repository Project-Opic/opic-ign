# ---- v1.1 增补：交付门面四件套（FUNC-34~37）与系统自动行为（B-AUTO-01~15）----
# 门面三接口的调用方是**下游中心的服务身份**（非界面用户），故 triggerType=SYSTEM；
# 可追溯门禁只约束 USER_ACTION 行为，FUNC-34/35/36 无界面控件（需求文档 3.2.1「查询类补充说明」）。
- id: FUNC-34
  name: 交付门面 · 任务受理
  ownerEntity: AGG-IGN-06
  behaviorType: COMMAND
  triggerType: SYSTEM
  preconditions:
  - 双重鉴权通过（上游业务权限 + 本域执行权限），服务身份记入 submittedBy
  - 执行动作码命中 IGN_ACTION 白名单且属交付动作层（R-12 / R-13；白名单内但属内部前置层 ezctl.new 或平台运维层 scripts.* 者同样治理拒绝）
  - 本机执行位可用：命令面挂载存在且可执行，否则受理即拒绝并记 TOOL_UNAVAILABLE（R-15，绝不静默改走别的执行位）
  - 节点增删类动作必须携带节点地址清单且地址格式合法（R-13 解析时校验；其余动作该字段必须为空）
  postconditions:
  - 同步返回本域 taskNo 作为远端任务引用（上游据此写 remote_task_ref）；执行本身异步（B-AUTO-11）
  - 受理安装首步前该集群工作目录内容已按登记事实对齐（B-AUTO-15，幂等可重入）
  - 同集群存在在途任务时照常受理并置 RUNNING（语义为排队中，R-17），不引入新状态、不判为失败
  appliedRules:
  - INV-28
  - INV-29
  - INV-30
  - INV-31
  - INV-32
  - INV-33
  - INV-34
  - INV-35
  - INV-36
  - INV-37
  - INV-38
  - INV-39
  - INV-40
  - R-05
  - R-12
  - R-13
  - R-15
  - R-17
  requiredPermissions:
  - PERM-FUNC-34
  syncTriggers: []
- id: FUNC-35
  name: 交付门面 · 回执与增量日志
  ownerEntity: AGG-IGN-06
  behaviorType: QUERY
  triggerType: SYSTEM
  preconditions:
  - 远端任务引用命中本域任务；未命中返回明确的"任务不存在"而非空回执
  postconditions:
  - 只读：不改任何对象，反复轮询无副作用（幂等读）
  appliedRules:
