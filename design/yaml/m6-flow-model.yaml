- id: FLOW-PROC-APP-01
  name: 执行机强制注销审批（单级）
  flowType: COLLABORATION
  description: ''
  businessObjectRefs: []
  roleRefs: []
  trigger:
    triggerType: MANUAL
  preconditions: []
  postconditions: []
  # nodeGraph 为可执行审批图（实现层：FUNC-31 提交申请入口汇聚为 ign_force_remove 载体，
  # 审批通过由 workbench 同事务触发拆除链；A06 事件发布为系统节点自动推进）。
  # edges 为执行必需（引擎按 approval_outcome 选路；缺失则实例止步于 start 节点）。
  nodeGraph:
    nodes:
    - { id: A01, type: start, name: 交付管理员提交强制注销申请（FUNC-31） }
    - { id: A02, type: approval_task, name: 平台运维管理员单节点审批, role_ref: IGN-ROLE-02, behavior_ref: FUNC-32, outcomes: [APPROVE, REJECT] }
    - { id: A06, type: system_task, name: 发布强制注销审批事件（opic.ign.executor.force_remove） }
    - { id: A03, type: end, name: 通过：进入拆除链（R-07 次序固定 / R-08 取消运行任务）, result: APPROVED }
    - { id: A04, type: end, name: 驳回：状态不变，意见留痕（FUNC-33）, result: REJECTED }
    edges:
    - { source: A01, target: A02 }
    - { source: A02, target: A06, approval_outcome: APPROVE }
    - { source: A02, target: A04, approval_outcome: REJECT }
    - { source: A06, target: A03 }
  startActivity: A01
  endActivities:
  - A08
  activities:
  - activityId: A01
    name: 提交强制注销申请 FUNC-31
    activityType: START
    roleRef: null
    behaviorRef: FUNC-31
    nextActivities:
