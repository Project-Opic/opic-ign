    label: 类型
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 注册远程执行机（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 执行机编号
    io: O
    required: false
    dataBinding: Executor
  - id: el05
    type: TEXT
    label: 名称
    io: O
    required: false
    dataBinding: Executor
  - id: el06
    type: TEXT
    label: 类型 ｜ 资产引用
    io: O
    required: false
