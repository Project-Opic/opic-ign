# ---- v1.3 批：子域 8「一域两屏」。menu-ign-template / menu-ign-config 各一屏；
#      FUNC-38~44 归模板屏（跨集群取值资产，整组编辑），FUNC-45~49 归配置屏（单集群单轴当前态）。
#      FUNC-50 是 SYSTEM 服务接口（跨中心只读通道），不进 MU、不发菜单。
- screenId: frmIgnTemplate
  name: 参数面模板维护
  screenType: MASTER_DETAIL_FORM
  hostedIn: frmIgnVersion
  tabName: 参数面模板
  carrierNote: v1.5 载体置换（Q-129）—— 退出侧栏二级叶、屏定义与元素表未变，“跨集群治理资产”的性质也未变：挂进「交付资产」叶是因为该叶回答“下次要交付什么 / 用什么参数”，而不是“某个集群现在怎样”；本屏不接受集群上下文，即使从台内跳过来也保持横看形态（8.1.1 收拢理由第 2 条的具体化）（9.8 载体注记）
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 文件面
    io: I
    required: true
    dataBinding: IgnParamTemplate.fileFace
    role: QUERY
    valueNote: 字典 IGN_CONFIG_FILE_FACE（两轴，一次一轴）；主表过滤与登记表单同源
  - id: el02
    type: SELECT
    label: 状态
    io: I
    required: false
    dataBinding: IgnParamTemplate.templateStatus
    role: QUERY
    valueNote: 字典 IGN_PARAM_TEMPLATE_STATE；缺省筛除 DISABLED 并提供「显示停用项」开关，已软删行默认可见（不违报表口径 3）
  - id: el03
    type: TEXTBOX
    label: 关键字
    io: I
    required: false
    dataBinding: IgnParamTemplate.templateName
    role: QUERY
    valueNote: 只匹配模板名与编号，不检索字段值内容（REP-15 p4）
  - id: el04
    type: TEXT
    label: 模板编号
    io: O
    required: false
    dataBinding: IgnParamTemplate.templateNo
    dataSource: REP-15
    valueNote: TMP-YYYYMMDD-NNNN，保存时分配、生成后只读
  - id: el05
    type: TEXT
    label: 模板名
    io: O
    required: false
    dataBinding: IgnParamTemplate.templateName
    dataSource: REP-15
    valueNote: 同一文件面内不重名（INV-41 同族面内约束）
  - id: el06
    type: TEXT
    label: 默认徽标
    io: O
    required: false
    dataBinding: IgnParamTemplate.isDefault
    dataSource: REP-15
    valueNote: 只在启用态出现（INV-43）；同文件面至多一行带徽标；对 IGN-ROLE-01 显示为只读徽标 + 原因位「跨集群影响面，由平台运维管理员操作」
  - id: el07
    type: TEXT
    label: 被引用集群数
    io: O
    required: false
    dataBinding: ClusterConfigOverride
    dataSource: REP-15
    valueNote: 反查本域覆写行 + 上游面标识声明（跨域只读标识，INV-33）；点击跳 frmIgnConfig（出处即下一步动作的位置）
  - id: el08
    type: GRID
    label: 从表｜模板字段行（整组编辑，保存提交的是整组 · R-22）
    io: O
    required: false
    dataBinding: ParamTemplateItem
    dataSource: REP-16
    valueNote: 按字段键字典序固定排列（同一面内任何时候同序，否则整组 diff 无法比对）；新增 / 删除行只在整组编辑态可用；无独立 CUD 入口
  - id: el09
    type: SELECT
    label: 字段行：字段键
    io: I
    required: true
    dataBinding: ParamTemplateItem.fieldKey
    valueNote: 合法域 = REF-17~REF-25 面定义（刻意不建字典，面定义改动不需重启界面）；面外键是治理拒绝、不是表单错误（INV-41）；面内不重行
  - id: el10
    type: TEXT
    label: 字段行：值形态
    io: O
    required: false
    dataBinding: ParamTemplateItem.valueShape
    valueNote: 字典 IGN_VALUE_SHAPE（SCALAR / LIST）；随字段键由面定义自动带出，不可人工改
  - id: el11
    type: TEXTBOX
    label: 字段行：值
    io: I
    required: false
    dataBinding: ParamTemplateItem.fieldValue
    valueNote: 单值 → 输入框；列表 → 多行输入（整体替换，无逐行增删控件，R-22）；值一律按口径 1 脱敏显示；可空（空值即让位给下层）
  - id: el12
    type: TEXT
    label: 字段行：让位标记
    io: O
    required: false
    dataBinding: ParamTemplateItem
    dataSource: REP-16
    valueNote: 值为空且该键由版本派生覆盖时显示「让位」，不显示为校验错误
  - id: el13
    type: TEXTBOX
    label: 用途说明
    io: I
    required: false
    dataBinding: IgnParamTemplate.description
    valueNote: 自由文本；不给「看起来一样」的两张模板做区分就只有靠编号猜
  - id: el14
    type: TEXTBOX
    label: 变更事由
    io: I
    required: false
    dataBinding: 动作入参（随 FUNC-41 / 42 / 43 / 44 提交并落审计，不入对象属性）
    valueNote: 启用 / 整组替换 / 设默认 / 软删除四类治理动作均必填（治理资产的动作留痕）
  - id: el15
    type: BUTTON
    label: 保存整组（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el16
    type: BUTTON
    label: 启用 / 停用（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el17
    type: BUTTON
    label: 设为默认（按钮，仅 IGN-ROLE-02 渲染）
    io: I
    required: false
    dataBinding: ''
  - id: el18
    type: BUTTON
    label: 软删除（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el19
    type: TEXT
    label: 启用时间 / 创建时间
    io: O
    required: false
    dataBinding: IgnParamTemplate.enabledAt
    valueNote: enabledAt 首次进入启用态时回填，草稿态为空；createdAt 登记时间（主表按登记时间倒序）
  actions:
  - actionId: act-FUNC-38
    name: 参数面模板列表查询
    actionType: QUERY
    behaviorRef: FUNC-38
    permissionRef:
    - PERM-FUNC-38
  - actionId: act-FUNC-39
    name: 参数面模板详情查询（含字段行整组与被引用出处）
    actionType: QUERY
    behaviorRef: FUNC-39
    permissionRef:
    - PERM-FUNC-39
  - actionId: act-FUNC-40
    name: 参数面模板登记
    actionType: OTHER
    behaviorRef: FUNC-40
    permissionRef:
    - PERM-FUNC-40
  - actionId: act-FUNC-41
    name: 参数面模板字段行整体覆写
    actionType: OTHER
    behaviorRef: FUNC-41
    permissionRef:
    - PERM-FUNC-41
  - actionId: act-FUNC-42
    name: 参数面模板启用 / 停用
    actionType: OTHER
    behaviorRef: FUNC-42
    permissionRef:
    - PERM-FUNC-42
  - actionId: act-FUNC-43
    name: 参数面模板设为默认
    actionType: OTHER
    behaviorRef: FUNC-43
    permissionRef:
    - PERM-FUNC-43
  - actionId: act-FUNC-44
    name: 参数面模板软删除（先返回引用出处再谈可否删）
    actionType: OTHER
    behaviorRef: FUNC-44
    permissionRef:
    - PERM-FUNC-44
- screenId: frmIgnConfig
  name: 集群交付配置台
  screenType: LIST_MAINTENANCE
  hostedIn: frmIgnClusterConsole
  tabName: 配置
  carrierNote: v1.5 载体置换（Q-129 / Q-130）—— 退出侧栏二级叶、屏定义与元素表一字未动（含四层取值、来源徽章、两列不合并、原文视图独立发牌等全部 v1.3 口径）。本屏是本批唯一没有横看入口的屏：它的天然坐标就是“单集群 + 单文件面”，脱离集群上下文无意义，因此 v1.5 起只能从集群交付台进入（9.9 载体注记）
  layout: ''
  elements:
  - id: el01
    type: REF_SELECT
    label: 集群标识
    io: I
    required: true
    dataBinding: ClusterConfigOverride.clusterRef
    role: QUERY
    dataSource: REP-19
    valueNote: 跨域引用 O-CLC（INV-33），跳选框；只列本域有交付记录或已登记配置的集群 —— v1.5 起该候选集由 REP-19 本域交付集群索引供数（FUNC-52 / ign:FUNC-52），不再取自参数面模板的被引用集群、也不再要求 FUNC-38 的牌（DEF-11 订正）；台内嵌入态由上下文给定、不渲染本选择器；未选定不出表
  - id: el02
    type: SELECT
    label: 文件面
    io: I
    required: true
    dataBinding: ClusterConfigOverride.fileFace
    role: QUERY
    valueNote: 字典 IGN_CONFIG_FILE_FACE；一次只看一轴，切换轴即整表重载（两轴键域不同，混看会得出错误的「当前值」）
  - id: el03
    type: TEXT
    label: 平台缺省面值（第 4 层地板）
    io: O
    required: false
    dataBinding: REF-17~REF-25 当前值（平台配置）
    dataSource: REP-17
    valueNote: 取数失败显示「不可用 + 原因」（报表口径 2），不以空值代替
  - id: el04
    type: TEXT
    label: 参数面模板值（第 3 层）
    io: O
    required: false
    dataBinding: ParamTemplateItem.fieldValue
    dataSource: REP-17
    valueNote: 该列显示的是本次取值上下文里那张牌的值 —— 未携带面标识时读接管标记快照里的那张牌（与受理侧同处解析，两侧不得各写一套）；两者都空 ⇒ 整列显示「—（未携带面标识，本层跳过）」，不回落到默认模板（R-20）
  - id: el05
    type: TEXT
    label: 交付版本派生值（第 2 层）
    io: O
    required: false
    dataBinding: DeliveryVersion
    dataSource: REP-17
    valueNote: 来自受理时命中版本目录的组件版本组
  - id: el06
    type: TEXT
    label: 覆写值 + 覆写状态 + 事由（第 1 层）
    io: O
    required: false
    dataBinding: ClusterConfigOverride.overrideValue
    dataSource: REP-17
    valueNote: 显示 IGN_OVERRIDE_STATE（生效 / 已回落）与事由
  - id: el07
    type: TEXT
    label: 生效值 + 生效来源徽章
    io: O
    required: false
    dataBinding: R-20 逐字段判定
    dataSource: REP-17
    valueNote: 必现、不得为空；取值为 IGN_PARAM_SOURCE 四值之一（OVERRIDE / VERSION_DERIVED / PARAM_TEMPLATE / PLATFORM_DEFAULT）
  - id: el08
    type: TEXT
    label: 当前落盘
    io: O
    required: false
    dataBinding: 工作目录派生
    dataSource: REP-17
    valueNote: 与「下次将生效」并列两列、不合并；覆写保存成功时本列不刷新（还没派发，刷新它就等于假装生效）
  - id: el09
    type: TEXT
    label: 下次将生效
    io: O
    required: false
    dataBinding: R-20 逐字段判定
    dataSource: REP-17
    valueNote: 清单归属冲突行显示「不渲染」，不给出一个不会用到的值
  - id: el10
    type: TEXT
    label: 应用追溯
    io: O
    required: false
    dataBinding: ClusterConfigOverride.appliedTaskNo
    dataSource: REP-17
    valueNote: appliedTaskNo / appliedAt 由 B-AUTO-15 回填；无值必须显示「未应用」，不给空单元格；可点跳 frmIgnTask 详情
  - id: el11
    type: TEXT
    label: 冲突标注
    io: O
    required: false
    dataBinding: R-18 判定
    dataSource: REP-17
    valueNote: 「已保存 · 未生效（清单归属冲突）」（R-24）—— 由受理侧 R-18 三态判定回吐，界面不自行推断；表头给出「覆写已登记、本次不参与渲染」的原因位
  - id: el12
    type: TEXTBOX
    label: 覆写浮层：新值
    io: I
    required: true
    dataBinding: ClusterConfigOverride.overrideValue
    valueNote: 初值 = 生效值（不是缺省面值，避免用户以为是空值覆盖）；列表值整体替换、无元素级增删控件（R-22）
  - id: el13
    type: TEXTBOX
    label: 覆写浮层：覆写事由
    io: I
    required: true
    dataBinding: ClusterConfigOverride.reason
    valueNote: 必填并落库（与模板动作的事由不同 —— 覆写事由是这条覆写的组成）
  - id: el14
    type: BUTTON
    label: 保存覆写（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el15
    type: BUTTON
    label: 回落为上层取值（按钮，仅对「生效」行渲染）
    io: I
    required: false
    dataBinding: ''
  - id: el16
    type: BUTTON
    label: 配置校验 dry-run（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el17
    type: BUTTON
    label: 查看原文（按钮，独立权限码 · 逐次留痕）
    io: I
    required: false
    dataBinding: ''
  - id: el18
    type: TEXT
    label: 原文只读浮层：带行号整份文本
    io: O
    required: false
    dataBinding: 工作目录派生文件
    dataSource: REP-18
    valueNote: 可复制、不提供导出控件；命中凭据形态整行掩码并在浮层顶部告警计数（过 R-16 同一套识别）；每次打开都重新读、重新审计，关闭不做缓存复用（R-26）
  - id: el19
    type: TEXT
    label: dry-run 结论区
    io: O
    required: false
    dataBinding: R-23 判定
    dataSource: ''
    valueNote: 文案与受理侧同源（同一套校验器，R-23）；五不：不写盘 / 不建任务 / 不占额度 / 不改覆写行 / 不进台账 —— 结论区不出现任务编号、不新增台账行
  actions:
