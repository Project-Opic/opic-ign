- id: R-18
  name: 集群交付配置对齐三态
  ruleType: CROSS_OBJECT
  description: 受理安装族步骤时把「台账拓扑（请求体节点清单，Q-72）+ 参数缺省面（REF-17~25）+ 交付版本派生」渲染成该集群的清单与配置并落盘 —— ① 工作目录无清单 ⇒ 生成并写本域派生标记（接管）；② 有本域标记 ⇒ 逐字段跟随事实变化改写（幂等可重入：同一步重复受理结论不变，台账加了节点则清单跟进）；③ 有清单而无本域标记 ⇒ 拒绝改写（冲突：人工或其他工具的既有事实不可被静默覆盖）。标记同时快照当次落盘的网段 / 后缀 / 仓库 / 成员，供执行位取用（单一事实源，不另设第二套清单）。节点增删类只核对在册事实、不改写清单；安装族首步未对齐 ⇒ 受理即刻拒绝（R-15），其余步骤沿用已对齐事实（权威步骤序列在上游，INV-36）｜读 ExecTask（来源两列 + 请求体清单与版本引用）；写集群工作目录的清单与配置 + 派生标记（命令面私有事实、不入对象模型，Q-69 裁定②）｜提交即强制（其冲突态的结论口径属「配置事实错误」，非 403 治理拒绝、非表单校验）
