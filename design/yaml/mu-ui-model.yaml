    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 执行机编号
    io: O
    required: false
    dataBinding: Executor
  - id: el05
    type: TEXT
    label: 名称
    io: O
    required: false
    dataBinding: Executor
  - id: el06
    type: TEXT
    label: 类型 ｜ 资产引用
    io: O
    required: false
    dataBinding: Executor.assetRef
  - id: el07
    type: TEXT
    label: 健康（含观测时间）
    io: O
    required: false
    dataBinding: lastHeartbeatAt 派生
  - id: el08
    type: TEXT
    label: 并发
    io: O
    required: false
    dataBinding: currentTasksCount
  - id: el09
    type: BUTTON
    label: 注销（空闲）（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el10
    type: BUTTON
    label: 强制注销申请（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el11
    type: TEXT
    label: 运行中任务清单
    io: O
    required: false
    dataBinding: ExecTask
  - id: el12
    type: TEXTBOX
    label: 强制原因
    io: I
    required: false
    dataBinding: ''
  - id: el13
    type: BUTTON
    label: 重新生成令牌（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-13
    name: 注册远程执行机
    actionType: OTHER
    behaviorRef: FUNC-13
    permissionRef:
    - PERM-FUNC-13
  - actionId: act-FUNC-14
    name: 重新生成引导令牌（含锁定解锁）
    actionType: OTHER
    behaviorRef: FUNC-14
    permissionRef:
    - PERM-FUNC-14
  - actionId: act-FUNC-15
    name: 执行机注销（空闲）
    actionType: OTHER
    behaviorRef: FUNC-15
    permissionRef:
    - PERM-FUNC-15
  - actionId: act-FUNC-16
    name: 执行机能力标签调整
    actionType: OTHER
    behaviorRef: FUNC-16
    permissionRef:
    - PERM-FUNC-16
  - actionId: act-FUNC-17
    name: 执行机列表查询（含健康视图）
    actionType: QUERY
    behaviorRef: FUNC-17
    permissionRef:
    - PERM-FUNC-17
  - actionId: act-FUNC-18
