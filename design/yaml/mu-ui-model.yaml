  - id: el12
    type: TEXTBOX
    label: 强制原因
    io: I
    required: false
    dataBinding: ''
  - id: el13
    type: BUTTON
    label: 重新生成令牌（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-13
    name: 注册远程执行机
