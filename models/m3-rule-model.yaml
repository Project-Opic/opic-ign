  name: 配置校验 dry-run 的五不与结论一致性
  ruleType: CROSS_OBJECT
  description: FUNC-48 复用受理侧同一套校验器与三态对齐判定，不写盘 / 不建任务 / 不占并发额度 / 不改覆写行 / 不进受理台账；输出「通过 / 不通过 + 逐字段原因」，且结论必须与真实受理一致（判定次序：先请求形态 R-13、再版本可用 R-19、再参数面形态、最后三态归属 R-18）。判据：预检与受理各写一套逻辑必然漂移，漂移之后「预检通过却受理失败」会把预检变成误导源 —— 宁可不提供预检｜读参数面 + 覆写 + 模板 + 版本目录（不写任何业务对象）｜调用即校验（无副作用）
