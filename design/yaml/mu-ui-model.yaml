    name: 清单原文只读视图
    actionType: QUERY
    behaviorRef: FUNC-45
    permissionRef:
    - PERM-FUNC-45
  - actionId: act-FUNC-46
    name: 集群交付配置查看（字段级 + 逐字段来源标注）
