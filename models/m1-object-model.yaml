- id: AGG-IGN-06
  name: 执行任务
  alias: ExecTask
  tableName: exec_task
  aggregateType: AGGREGATE_ROOT
  description: 对象分类
  lifecycle:
  - 启用
  - 停用
  tags:
  - 对象分类
  attributes:
  - name: taskNo
    label: 任务编号
    type: String
    required: true
    unique: true
  - name: executorRef
    label: 所属执行机
    type: Ref
    required: true
    unique: false
  - name: action
    label: 执行动作
    type: Dict
    required: true
    unique: false
    description: IGN_ACTION 白名单固定枚举；v1.1 三层可达面（交付动作层 / 内部前置层 ezctl.new / 平台运维层 scripts.*）见 R-12 与需求文档 7.3
  - name: stepCode
    label: 步骤编码
    type: Dict
    required: false
    unique: false
    description: 条件必填（v1.1）；IGN_INSTALL_STEP 01~07，仅 ezctl.setup 必填、其余动作必须为空（INV-36）。本域只认参数合法域，步骤状态机权威在 O-CLC
  - name: args
    label: 动作参数
    type: String
    required: true
    unique: false
  - name: env
    label: 环境变量
    type: String
    required: false
    unique: false
  - name: workingDir
    label: 工作目录
    type: String
    required: false
    unique: false
  - name: clusterRef
    label: 关联集群
    type: Ref
    required: true
    unique: false
  - name: sourceTaskNo
    label: 来源任务标识
    type: String
    required: false
    unique: false
    description: 条件必填（v1.1）；上游中心（O-CLC）任务编号，门面受理必填、人工提交必须为空，跨域只存标识（INV-34）
  - name: sourceStepIndex
    label: 来源步骤序号
    type: Integer
    required: false
    unique: false
    description: 条件必填（v1.1）；上游步骤序号（≥1），与来源任务标识共同构成门面幂等键（INV-35）
  - name: requestTokenDigest
    label: 请求令牌摘要
    type: String
    required: false
    unique: true
    description: 条件必填（v1.1，原为必填）：人工提交必填；门面受理以幂等键替代令牌，该列为空 —— 摘要唯一索引只对非空值生效（INV-31 / INV-35）
  - name: remoteTaskId
    label: 远端任务标识
    type: String
    required: false
    unique: false
  - name: taskStatus
    label: 任务状态
    type: Dict
    required: true
    unique: false
  - name: exitCode
    label: 退出码
    type: Integer
    required: false
    unique: false
    description: 终态时由执行位回报；LOST 不得有退出码（INV-37）
  - name: verdictSource
    label: 结论依据
    type: Dict
    required: false
    unique: false
    description: 条件必填（v1.1）；IGN_VERDICT_SOURCE，终态必填 —— 剧本汇总优先于退出码（B-AUTO-12），LOST 专用 TRACE_LOST（INV-37；报表口径 7 的对象层落点）
  - name: failReason
    label: 失败原因
    type: Dict
    required: false
    unique: false
  - name: timeoutSeconds
    label: 超时秒数
    type: Integer
    required: true
    unique: false
  - name: startedAt
    label: 开始时间
    type: DateTime
    required: false
    unique: false
  - name: endedAt
    label: 结束时间
    type: DateTime
    required: false
    unique: false
  - name: durationMs
    label: 耗时（毫秒）
    type: Integer
    required: false
    unique: false
  - name: submittedBy
    label: 提交人
    type: String
    required: true
    unique: false
  - name: createdAt
    label: 创建时间
    type: DateTime
    required: true
    unique: false
  entities:
  - name: 任务日志行
    alias: TaskLogLine
    tableName: ign_task_log
    description: 一条执行任务在执行位产生的输出行（表 ign_task_log / schema ign，v1.1 由 task_log 更名）。对象分类：聚合内子实体——不可独立存在、不独立编号（以「所属任务 + 行游标」定位）、任务删除时级联删除；高频时序数据不是台账，受保留期约束（REF-16）。v1.1 由「中继回流视图」升格为子实体：本机执行位下日志行是本域自己写入的数据行，逐行入库（INV-38）→ 写前不可逆脱敏（R-16 / INV-40）→ 门面按游标增量吐回（FUNC-35）；上游不留副本，两域之间不复制第二份日志存储。
    localId: seq
    cardinality: ZERO_OR_MORE
    cascadeDelete: true
    attributes:
    - name: taskRef
      label: 所属任务
      type: Ref
      required: true
      description: 引用本域任务；与行游标联合唯一
    - name: seq
      label: 行游标
      type: Integer
      required: true
      description: 任务内单调递增、只增不改；乱序或重复到达的行直接丢弃不入库（INV-38）；断线续传与门面增量回吐的起点
    - name: direction
      label: 流向
      type: Dict
      required: true
      description: IGN_LOG_DIRECTION；TOOL（v1.1 执行位子进程逐行输出）/ PLATFORM / RELAY / AGENT
    - name: logLine
      label: 日志行
      type: String
      required: true
      description: 落库前完成不可逆脱敏（INV-40）；超长截断并标注（REF-12）
    - name: loggedAt
      label: 产生时间
      type: DateTime
      required: true
      description: 执行位侧采集时刻
    - name: masked
      label: 已脱敏
      type: Boolean
      required: true
      description: v1.1；该行是否命中掩码规则后被改写 —— 审计需要「日志被动过」可见，而非静默替换
    - name: createdAt
      label: 登记时间
      type: DateTime
      required: true
