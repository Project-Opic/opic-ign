- id: AGG-IGN-06
  name: 执行任务
  alias: ExecTask
  tableName: exec_task
  aggregateType: AGGREGATE_ROOT
  description: 对象分类
  lifecycle:
  - 启用
  - 停用
  tags:
  - 对象分类
  attributes:
  - name: taskNo
    label: 任务编号
    type: String
    required: true
    unique: true
  - name: executorRef
    label: 所属执行机
    type: Ref
    required: true
    unique: false
  - name: action
    label: 执行动作
    type: Dict
    required: true
    unique: false
    description: IGN_ACTION 白名单固定枚举；v1.1 三层可达面（交付动作层 / 内部前置层 ezctl.new / 平台运维层 scripts.*）见 R-12 与需求文档 7.3
  - name: stepCode
    label: 步骤编码
    type: Dict
    required: false
    unique: false
    description: 条件必填（v1.1）；IGN_INSTALL_STEP 01~07，仅 ezctl.setup 必填、其余动作必须为空（INV-36）。本域只认参数合法域，步骤状态机权威在 O-CLC
  - name: args
    label: 动作参数
    type: String
    required: true
    unique: false
  - name: env
    label: 环境变量
    type: String
    required: false
    unique: false
  - name: workingDir
    label: 工作目录
    type: String
    required: false
    unique: false
  - name: clusterRef
    label: 关联集群
    type: Ref
    required: true
    unique: false
  - name: sourceTaskNo
    label: 来源任务标识
    type: String
    required: false
    unique: false
    description: 条件必填（v1.1）；上游中心（O-CLC）任务编号，门面受理必填、人工提交必须为空，跨域只存标识（INV-34）
  - name: sourceStepIndex
    label: 来源步骤序号
    type: Integer
    required: false
    unique: false
    description: 条件必填（v1.1）；上游步骤序号（≥1），与来源任务标识共同构成门面幂等键（INV-35）
  - name: requestTokenDigest
    label: 请求令牌摘要
    type: String
    required: false
    unique: true
    description: 条件必填（v1.1，原为必填）：人工提交必填；门面受理以幂等键替代令牌，该列为空 —— 摘要唯一索引只对非空值生效（INV-31 / INV-35）
  - name: remoteTaskId
    label: 远端任务标识
    type: String
    required: false
    unique: false
  - name: taskStatus
    label: 任务状态
    type: Dict
    required: true
    unique: false
  - name: exitCode
    label: 退出码
    type: Integer
    required: false
    unique: false
    description: 终态时由执行位回报；LOST 不得有退出码（INV-37）
  - name: verdictSource
    label: 结论依据
    type: Dict
    required: false
    unique: false
    description: 条件必填（v1.1）；IGN_VERDICT_SOURCE，终态必填 —— 剧本汇总优先于退出码（B-AUTO-12），LOST 专用 TRACE_LOST（INV-37；报表口径 7 的对象层落点）
  - name: failReason
    label: 失败原因
    type: Dict
    required: false
    unique: false
  - name: timeoutSeconds
    label: 超时秒数
    type: Integer
    required: true
    unique: false
  - name: startedAt
    label: 开始时间
    type: DateTime
    required: false
    unique: false
  - name: endedAt
    label: 结束时间
    type: DateTime
    required: false
    unique: false
  - name: durationMs
    label: 耗时（毫秒）
    type: Integer
    required: false
    unique: false
  - name: submittedBy
    label: 提交人
    type: String
    required: true
    unique: false
  - name: createdAt
    label: 创建时间
    type: DateTime
    required: true
    unique: false
  entities:
  - name: 任务日志行
    alias: TaskLogLine
    tableName: ign_task_log
    description: 一条执行任务在执行位产生的输出行（表 ign_task_log / schema ign，v1.1 由 task_log 更名）。对象分类：聚合内子实体——不可独立存在、不独立编号（以「所属任务 + 行游标」定位）、任务删除时级联删除；高频时序数据不是台账，受保留期约束（REF-16）。v1.1 由「中继回流视图」升格为子实体：本机执行位下日志行是本域自己写入的数据行，逐行入库（INV-38）→ 写前不可逆脱敏（R-16 / INV-40）→ 门面按游标增量吐回（FUNC-35）；上游不留副本，两域之间不复制第二份日志存储。
    localId: seq
    cardinality: ZERO_OR_MORE
    cascadeDelete: true
    attributes:
    - name: taskRef
      label: 所属任务
      type: Ref
      required: true
      description: 引用本域任务；与行游标联合唯一
    - name: seq
      label: 行游标
      type: Integer
      required: true
      description: 任务内单调递增、只增不改；乱序或重复到达的行直接丢弃不入库（INV-38）；断线续传与门面增量回吐的起点
    - name: direction
      label: 流向
      type: Dict
      required: true
      description: IGN_LOG_DIRECTION；TOOL（v1.1 执行位子进程逐行输出）/ PLATFORM / RELAY / AGENT
    - name: logLine
      label: 日志行
      type: String
      required: true
      description: 落库前完成不可逆脱敏（INV-40）；超长截断并标注（REF-12）
    - name: loggedAt
      label: 产生时间
      type: DateTime
      required: true
      description: 执行位侧采集时刻
    - name: masked
      label: 已脱敏
      type: Boolean
      required: true
      description: v1.1；该行是否命中掩码规则后被改写 —— 审计需要「日志被动过」可见，而非静默替换
    - name: createdAt
      label: 登记时间
      type: DateTime
      required: true
# ---- v1.3 批（易用性 / 管理员体验增补）：参数面治理两个聚合根 ----
# 建对象判据（需求文档 2.8 / 2.9「红线」段）：入模型的是「谁定了这套口径」「这个集群被人工改过哪个字段、
# 这次改动被哪一次受理用掉」这两类治理事实；清单与配置文件文本本体继续不入模型（R-24 / Q-69 裁定②）。
- id: AGG-IGN-07
  name: 交付参数面模板
  alias: IgnParamTemplate
  tableName: ign_param_template
  aggregateType: AGGREGATE_ROOT
  description: 对象分类：主数据型（配置资产，可增可改可软删）。表 ign_param_template / schema ign，v1.3 新增。一份可复用的参数面取值集合：绑定一个文件面，内含若干「字段键 + 字段值 + 值形态」行，是「这类集群该用什么参数」的人工表达 —— 介于平台缺省面（REF-17~25，所有集群一刀切）与集群覆写（AGG-IGN-08，一次只改一个集群）之间的那一层。业务编号 TMP 前缀 + 4 位流水。
  lifecycle:
  - 草稿
  - 启用
  - 停用
  tags:
  - 主数据
  attributes:
  - name: templateNo
    label: 模板编号
    type: String
    required: true
    unique: true
    description: 业务编号 TMP-YYYYMMDD-NNNN，登记时生成、生成后只读
  - name: templateName
    label: 模板名称
    type: String
    required: true
    unique: true
    description: 人工命名，重名即拒绝（唯一性口径与版本名同族）
  - name: fileFace
    label: 文件面
    type: Dict
    required: true
    unique: false
    description: IGN_CONFIG_FILE_FACE：HOSTS（主机清单面）/ CONFIG（集群配置面）。一张模板只属一个文件面 —— 跨面混装会让「整体替换」失去边界
  - name: templateStatus
    label: 模板状态
    type: Dict
    required: true
    unique: false
    description: IGN_PARAM_TEMPLATE_STATE：DRAFT / ENABLED / DISABLED；只有启用态可被取值四层引用（R-20 第三层）；软删除是标记、不是第四个取值
  - name: isDefault
    label: 默认标记
    type: Boolean
    required: true
    unique: false
    description: 同一文件面内至多一个默认且默认须为启用态（INV-43）；默认只作用于「新建时缺省挂哪张」，不改变已覆写字段的优先级
  - name: description
    label: 用途说明
    type: String
    required: false
    unique: false
    description: 自由文本；不给「看起来一样」的两张模板做区分就只有靠编号猜
  - name: enabledAt
    label: 启用时间
    type: DateTime
    required: false
    unique: false
    description: 首次进入启用态时回填；可空（草稿态）
  - name: createdAt
    label: 创建时间
    type: DateTime
    required: true
    unique: false
  entities:
  - name: 模板字段行
    alias: ParamTemplateItem
    tableName: ign_param_template_item
    description: 模板内的单条参数面取值（表 ign_param_template_item / schema ign，v1.3 新增）。对象分类：聚合内子实体——不可独立存在、不独立编号（以「所属模板 + 字段键」定位），随主表整组读写、整组替换（R-22），模板删除时级联删除。没有单行编辑入口：子实体的「改」只有 FUNC-41 这一个整组动作。
    localId: fieldKey
    cardinality: ZERO_OR_MORE
    cascadeDelete: true
    attributes:
    - name: templateRef
      label: 所属模板
      type: Ref
      required: true
      description: 引用本域模板；与字段键联合唯一
    - name: fieldKey
      label: 字段键
      type: String
      required: true
      description: 合法域 = REF-17~REF-25 参数面定义（面定义即校验器键集合，按需求文档 7.3 第三处刻意不建字典）；面外键是治理拒绝不是表单错误（INV-41）；模板内不重行
    - name: fieldValue
      label: 字段值
      type: String
      required: true
      description: 按受理侧同一套形态校验器判定，与 FUNC-48 校验、真实受理三处口径一致（R-23）；可为空串（表示该项由上层或现场决定，界面显示「让位」而非错误）；显示一律按报表口径 1 脱敏
    - name: valueShape
      label: 值形态
      type: Dict
      required: true
      description: IGN_VALUE_SHAPE：SCALAR（标量替换）/ LIST（列表整体替换，R-22）；随字段键由面定义自动带出、不可人工改
- id: AGG-IGN-08
  name: 集群交付配置覆写
  alias: ClusterConfigOverride
  tableName: ign_cluster_config_override
  aggregateType: AGGREGATE_ROOT
  description: 对象分类：记录 + 状态混合型（治理事实台账，不占主数据清单、也不是任务台账）。表 ign_cluster_config_override / schema ign，v1.3 新增。一条「某个集群的某个字段，人工决定不用派生值而用这个值」的登记：定位坐标是「集群标识 + 文件面 + 字段键」，不独立编号（逐行取号会让「查一个集群改过哪些字段」变成两次查询）。它是四层取值里最高那一层的事实台账；「运维能看见自己改过什么、并一键改回去」是本批目的，「把配置文件搬进数据库」不是。
  lifecycle:
  - 生效
  - 已回落
  tags:
  - 治理台账
  attributes:
  - name: clusterRef
    label: 集群标识
    type: Ref
    required: true
    unique: true
    description: 跨域引用 O-CLC 集群，只存标识、不直查他域表（与 INV-33 同族，复用任务已有的集群标识引用、不新增第五条跨域线）；与文件面 + 字段键联合唯一（INV-42）
  - name: fileFace
    label: 文件面
    type: Dict
    required: true
    unique: true
    description: IGN_CONFIG_FILE_FACE，同 AGG-IGN-07；天然坐标之二
  - name: fieldKey
    label: 字段键
    type: String
    required: true
    unique: true
    description: 限参数面内（REF-17~25，INV-41，与模板字段行共用同一套面定义、不重复建 INV）；天然坐标之三
  - name: overrideValue
    label: 覆写值
    type: String
    required: true
    unique: false
    description: 过受理侧同一套校验器（R-23 三处口径一致）；列表型为整体替换后的全量值（R-22）
  - name: valueShape
    label: 值形态
    type: Dict
    required: true
    unique: false
    description: IGN_VALUE_SHAPE：SCALAR / LIST；决定校验器分支与回落粒度（列表值的回落是一键回落整项）
  - name: overrideStatus
    label: 覆写状态
    type: Dict
    required: true
    unique: false
    description: IGN_OVERRIDE_STATE：EFFECTIVE / ROLLED_BACK；生效 ⇄ 已回落可往复（回落不是删除，是「这一次人工决定不再作数」）
  - name: reason
    label: 覆写事由
    type: String
    required: true
    unique: false
    description: 必填：治理事实必须说为什么改（与「显式降级要留痕」同纪律，定性三 ③）
  - name: appliedTaskNo
    label: 已应用任务号
    type: String
    required: false
    unique: false
    description: 由 B-AUTO-15 在下一次受理对齐时回填（该覆写真实参与渲染的那次任务）；状态为已回落时必须为空（INV-42）；回答「我改的到底生效了没」
  - name: appliedAt
    label: 已应用时间
    type: DateTime
    required: false
    unique: false
    description: 与 appliedTaskNo 成对出现、成对清空；界面在两者为空时显式显示「未应用」，不给空单元格
  - name: overriddenBy
    label: 操作人
    type: String
    required: true
    unique: false
    description: 最后一次覆写 / 回落的人工身份
  - name: overriddenAt
    label: 操作时间
    type: DateTime
    required: true
    unique: false
    description: 最后一次写入时刻
  - name: rolledBackAt
    label: 回落时间
    type: DateTime
    required: false
    unique: false
    description: 进入已回落态时回填；与追溯对的清空同时发生（不留「已失效的追溯对」误导为仍生效）
