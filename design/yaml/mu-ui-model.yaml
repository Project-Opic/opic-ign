    label: 失败原因
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el08
    type: TEXT
    label: 最近预推时间
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el09
    type: BUTTON
    label: 镜像清单覆写（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-09
    name: 触发镜像预推
    actionType: OTHER
    behaviorRef: FUNC-09
    permissionRef:
    - PERM-FUNC-09
  - actionId: act-FUNC-10
    name: 镜像清单人工覆写
    actionType: OTHER
    behaviorRef: FUNC-10
    permissionRef:
    - PERM-FUNC-10
  - actionId: act-FUNC-11
    name: 预推失败重试（断点续推）
    actionType: OTHER
    behaviorRef: FUNC-11
    permissionRef:
    - PERM-FUNC-11
  - actionId: act-FUNC-12
    name: 预推明细查询
    actionType: QUERY
    behaviorRef: FUNC-12
    permissionRef:
    - PERM-FUNC-12
- screenId: frmIgnExecutor
  name: 执行机操作台
  screenType: SINGLE_FORM
  entryNote: v1.5 就地升格为宿主屏（Q-133）—— 侧栏「执行位」一级叶的两签＝「执行机 ｜ 通道安全」，「通道安全」页签挂载 frmIgnTls 既有屏定义；强制注销审批弹窗（FUNC-31~33）位置不变、不升格为页签（升格会把“审批”变成可浏览的常驻视图，与 PROC-APP-01 的单级审批语义不符）（9.3 载体注记）
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 治理状态
    io: I
    required: false
    dataBinding: Executor.status
    role: QUERY
  - id: el02
