  orderBy: []
  pagination:
    enabled: false
    defaultPageSize: 0
    maxPageSize: 0
  reportOptions: null
  version: '1.3'
  caliberNote: 口径注记（v1.3）：本域唯一「查询类但单独发牌」的报表（分类归属与权限档位解耦，判据是内容敏感度，R-26）；也是唯一「读也留痕」的报表（5.20 ⑰，其余 17 张保持读不留痕）；不提供任何写入口（写入口是 FUNC-47 字段级覆写，走另一张牌）；每次打开都重新读、重新审计，关闭不做缓存复用
- id: REP-19
  name: 本域交付集群索引
  alias: rep19
  objectType: LIST_QUERY
  description: 列表 · 派生聚合（规格 5.21，v1.5 新增）。本域第一条「为界面而发」的查询报表：一行一个集群标识 + 四个即时派生摘要列，回答「本域替哪些集群跑过交付、此刻有没有待处理的东西」；行集是两个既有对象 clusterRef 的并集去重，不是任何一张表。
  behaviorRef: FUNC-52
  sourceObjects:
  - objectRef: AGG-IGN-06
    alias: exectask
    primary: true
    sourceNote: 列表（按 clusterRef 分组）；交付记录数 / 最近一次交付 / 未决偏差数三列由本对象派生
  joins:
  - objectRef: AGG-IGN-08
    alias: clusterconfigoverride
    joinType: FULL
    onExpression: ExecTask.clusterRef = ClusterConfigOverride.clusterRef
    joinNote: 并集语义 —— 只在一侧有记录也要出行（只登记覆写未派发 / 只跑过任务未覆写都是常态）；两侧都空的集群不在本表，也不该在本表
  parameters:
  - name: p1
    label: 集群标识（关键字）
    dataType: String
    required: false
    allowedOperators:
    - LIKE
    sourceField: ''
  - name: p2
    label: 待办筛项（全部 / 有在跑任务 / 有生效覆写 / 有未决偏差）
    dataType: String
    required: false
    allowedOperators:
    - EQ
    sourceField: ''
  conditions:
  - conditionId: C01
    leftExpression: ExecTask.clusterRef
    operator: LIKE
    parameterRef: p1
    logicalConnector: AND
    group: BASE
  - conditionId: C02
    leftExpression: 派生待办标志（在跑任务数 > 0 / 生效覆写字段数 > 0 / 未决偏差数 > 0）
    operator: EQ
    parameterRef: p2
    logicalConnector: AND
    group: BASE
  resultColumns:
  - name: c1
    label: 集群标识
    dataType: String
    sourceExpression: DISTINCT union(ExecTask.clusterRef, ClusterConfigOverride.clusterRef)
    aggregateFunction: NONE
    sortable: true
  - name: c2
    label: 交付记录数（含终态，口径 12）
    dataType: Integer
    sourceExpression: count(ExecTask.taskNo)
    aggregateFunction: COUNT
    sortable: false
  - name: c3
    label: 最近一次交付（任务编号 + 结束时间 + 结果；LOST 单列不并入失败，口径 7；可跳 REP-10）
    dataType: String
    sourceExpression: 该 clusterRef 最新一行的 taskNo / endedAt / taskStatus / verdictSource
    aggregateFunction: NONE
    sortable: true
  - name: c4
    label: 已登记覆写字段数（生效态；已回落不计入但台内可见）
    dataType: Integer
    sourceExpression: count(ClusterConfigOverride 生效态行)
    aggregateFunction: COUNT
    sortable: false
  - name: c5
    label: 未决偏差数（LOST 与已发生状态修正的任务计数，由状态与结论依据两列派生；为 0 显示 0 不留空）
    dataType: Integer
    sourceExpression: count(ExecTask where taskStatus=LOST or 结论依据已被纠偏)
    aggregateFunction: COUNT
    sortable: false
  - name: c6
    label: 进入集群交付台（动作列，非数据列 —— 恒可见，可见性判据只有一条：该标识在本表出现过）
    dataType: String
    sourceExpression: 路由 /ign/console/:clusterRef
    aggregateFunction: NONE
    sortable: false
  groupBy:
  - name: g1
    sourceExpression: union(ExecTask.clusterRef, ClusterConfigOverride.clusterRef)
    groupByType: FIELD
  having: []
  orderBy:
  - name: o1
    sourceExpression: max(ExecTask.finishedAt)
    direction: DESC
  pagination:
    enabled: true
    defaultPageSize: 20
    maxPageSize: 100
  reportOptions: null
  version: '1.5'
  caliberNote: 口径注记（v1.5）：① **并集语义** —— 本表列的是「本域服务过的」，不是「存在的」，后者是 O-CLC 的权威、本域不抄（INV-33）；② **零新事实** —— 四个数据列全从两个既有对象的现有关联列现算，不建新表、不加列、不建统计缓存（缓存即制造「列表说 3 条、台内只有 2 条」的两张皮）；③ 摘要列是派生结论，**必须标统计时点**，不得读作「该集群现在的状态」（口径 7 家族）；④ 与 REP-17 不是「同一报表两个入口」—— REP-17 是单集群 + 单文件面的逐字段明细且必须先选定二者，REP-19 是跨集群标识清单、是前者的上游；⑤ 不发独立权限码档位（普通查询档，不进 8.6 第 19 项两处之列）、不占「无报表查询」例外（它有展示面）、不进「读也留痕」之列（口径 8 只约束原文类视图）；⑥ 单一排序（最近一次交付结束时间倒序），无结束时间的行按开始时间垫后并标注「进行中」，不做多列排序（口径 6 家族）；⑦ 空态文案是「本域尚未替任何集群执行过交付」，不得写成「没有集群」；⑧ 不提供导出（与 REP-11 / REP-18 同族，5.20 ⑬ —— 它是导航入口不是交付凭证）