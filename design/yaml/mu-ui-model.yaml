    - PERM-FUNC-01
  - actionId: act-FUNC-02
    name: 版本登记信息修改
    actionType: OTHER
    behaviorRef: FUNC-02
    permissionRef:
    - PERM-FUNC-02
  - actionId: act-FUNC-03
    name: 触发发行包下载
    actionType: OTHER
    behaviorRef: FUNC-03
    permissionRef:
    - PERM-FUNC-03
