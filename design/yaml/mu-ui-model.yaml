    dataBinding: ''
  actions:
  - actionId: act-FUNC-09
    name: 触发镜像预推
    actionType: OTHER
    behaviorRef: FUNC-09
    permissionRef:
    - PERM-FUNC-09
  - actionId: act-FUNC-10
    name: 镜像清单人工覆写
    actionType: OTHER
    behaviorRef: FUNC-10
    permissionRef:
    - PERM-FUNC-10
  - actionId: act-FUNC-11
    name: 预推失败重试（断点续推）
    actionType: OTHER
    behaviorRef: FUNC-11
    permissionRef:
    - PERM-FUNC-11
  - actionId: act-FUNC-12
    name: 预推明细查询
    actionType: QUERY
    behaviorRef: FUNC-12
    permissionRef:
    - PERM-FUNC-12
- screenId: frmIgnExecutor
