  - actionId: act-FUNC-21
    name: TLS 显式降级声明（实验环境）
    actionType: OTHER
    behaviorRef: FUNC-21
    permissionRef:
    - PERM-FUNC-21
  - actionId: act-FUNC-22
    name: 证书绑定清单查询（含临期视图）
    actionType: QUERY
    behaviorRef: FUNC-22
    permissionRef:
    - PERM-FUNC-22
- screenId: frmIgnTask
  name: 任务提交与台账
  screenType: MASTER_DETAIL_FORM
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 执行机
    io: I
    required: true
    dataBinding: Executor 筛选
    role: QUERY
    valueNote: v1.1 只列「就绪 + 未超载 + 健康」项，LOCAL 执行位置顶；TOOL_UNAVAILABLE 时在下方原因位给出「本机执行位不可用：命令面挂载缺失」，不静默置灰（R-15）
  - id: el02
    type: SELECT
    label: 执行动作
    io: I
    required: true
    dataBinding: ''
    role: QUERY
    valueNote: 字典 IGN_ACTION（白名单，INV-28 / R-12）
  - id: el03
    type: TEXTBOX
    label: 动作参数
    io: I
    required: true
    dataBinding: ExecTask.args
    valueNote: 结构化独立 argv、无 shell 解释；人工路径保留输入位，门面路径无此位（R-13 派生）
  - id: el04
    type: REF_SELECT
    label: 关联集群
    io: I
    required: true
    dataBinding: ExecTask.clusterRef
    valueNote: 跨域引用 O-CLC（INV-33），跳选框
  - id: el05
    type: NUMBER
    label: 超时秒数
    io: I
    required: true
    dataBinding: ExecTask.timeoutSeconds
    valueNote: 缺省取平台配置（REF-02）
  - id: el06
    type: BUTTON
    label: 提交（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el07
    type: BUTTON
    label: 取消执行任务（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el08
    type: TEXT
    label: 环境变量
    io: O
    required: false
    dataBinding: ExecTask.env
  - id: el09
    type: TEXT
    label: 状态 + 结论依据 + 对账注记（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: LOST 用「痕迹不可存活」中性色且退出码位为空（INV-37）；经对账修正的任务显示修正痕迹（口径 7）
  - id: el10
    type: SELECT
    label: 步骤编码（v1.1）
    io: I
    required: false
    dataBinding: ExecTask.stepCode
    valueNote: 条件必填——仅 ezctl.setup 可见且必填，取字典 IGN_INSTALL_STEP（01~07，INV-36）；其余动作隐藏并置空
  - id: el11
    type: TEXT
    label: 来源任务标识 + 来源步骤序号（v1.1）
    io: O
    required: false
    dataBinding: ExecTask.sourceTaskNo / sourceStepIndex
    valueNote: 只读列、无输入位（INV-34）；非空即「由门面受理」，点击进入门面受理台账反查（FUNC-37）
  - id: el12
    type: GRID
    label: 从表｜任务日志行（v1.1，只读）
    io: O
    required: false
    dataBinding: ExecTask.logs
    dataSource: REP-11
    valueNote: 行游标 / 时间 / 流向（含工具输出）/ 内容 / 已脱敏标记；游标空洞显式标注（INV-38）；按游标增量拉取、不提供导出（口径 5）
  actions:
  - actionId: act-FUNC-23
    name: 提交执行任务
    actionType: DRAFT
    behaviorRef: FUNC-23
    permissionRef:
    - PERM-FUNC-23
  - actionId: act-FUNC-24
    name: 取消执行任务
    actionType: OTHER
    behaviorRef: FUNC-24
    permissionRef:
    - PERM-FUNC-24
- screenId: frmIgnLog
  name: 日志与对账台
  screenType: QUERY_LIST
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 任务
    io: I
    required: false
    dataBinding: ExecTask.taskNo
  - id: el02
    type: TEXT
    label: 时间
    io: O
    required: false
    dataBinding: 日志通道
  - id: el03
    type: TEXT
    label: 流向
    io: O
    required: false
    dataBinding: 日志通道
  - id: el04
    type: TEXT
    label: 日志行
    io: O
    required: false
    dataBinding: 日志通道
    valueNote: v1.1 改绑子实体 TaskLogLine.logLine（本域唯一的日志存储，界面与门面回读同源同脱敏，INV-40）
  - id: el05
    type: TAB
    label: 对账与纠偏（页签）
    io: I
    required: false
    dataBinding: 纠偏记录
  - id: el06
    type: TEXT
    label: 状态 + 结论依据 + 对账修正（v1.1 三件同现）
    io: O
    required: false
    dataBinding: ExecTask
    valueNote: 结论依据取 IGN_VERDICT_SOURCE（退出码 / 剧本汇总 / 代理回执 / 无法验真）；LOST 落「痕迹不可存活」且退出码位为空（INV-37）
  - id: el07
    type: TEXT
    label: 行游标（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.seq
    valueNote: 单调递增、空洞显式标注为「少了几行」（INV-38）；与主表「游标右界」列同坐标——上游回读用的与界面看到的是同一个
  - id: el08
    type: TEXT
    label: 已脱敏标记（v1.1）
    io: O
    required: false
    dataBinding: TaskLogLine.masked
    valueNote: 命中掩码规则被改写的行标出「日志被动过」，而非静默替换（R-16）
  - id: el09
    type: TAB
    label: 门面受理台账（页签，v1.1）
    io: O
    required: false
    dataBinding: ExecTask（固定过滤来源任务标识非空）
    dataSource: REP-14
    valueNote: 来源任务标识 + 来源步骤序号 / 结论依据 / 日志行数与游标右界；对四个界面角色开放（不含参数与命令面，敏感级低于纠偏页签）；默认「来源非空 + 最近 7 天」
  actions:
  - actionId: act-FUNC-25
    name: 任务台账查询
    actionType: QUERY
    behaviorRef: FUNC-25
    permissionRef:
    - PERM-FUNC-25
  - actionId: act-FUNC-26
    name: 任务详情查询
    actionType: QUERY
    behaviorRef: FUNC-26
    permissionRef:
    - PERM-FUNC-26
  - actionId: act-FUNC-27
    name: 任务日志查询（中继回流视图）
    actionType: QUERY
    behaviorRef: FUNC-27
    permissionRef:
    - PERM-FUNC-27
  - actionId: act-FUNC-28
    name: 对账与纠偏台账查询
    actionType: QUERY
    behaviorRef: FUNC-28
    permissionRef:
    - PERM-FUNC-28
  - actionId: act-FUNC-37
    name: 门面受理台账查询
    actionType: QUERY
    behaviorRef: FUNC-37
    permissionRef:
    - PERM-FUNC-37
- screenId: frmIgnOps
  name: 统计与参数
  screenType: QUERY_LIST
  layout: ''
  elements:
  - id: el01
    type: TEXT
    label: 版本数
    io: O
    required: false
    dataBinding: DeliveryVersion 聚合
  - id: el02
    type: TEXT
    label: 可用版本
    io: O
    required: false
    dataBinding: DeliveryVersion 聚合
  - id: el03
    type: TEXT
    label: 执行机就绪
    io: O
    required: false
    dataBinding: Executor 聚合
  - id: el04
    type: TEXT
    label: 不可达
    io: O
    required: false
    dataBinding: Executor 聚合
  - id: el05
    type: TEXT
    label: 任务 7 日成功
    io: O
    required: false
    dataBinding: ExecTask 聚合
  - id: el06
    type: TEXT
    label: 纠偏次数
    io: O
    required: false
    dataBinding: 纠偏记录
  - id: el07
    type: TEXTBOX
    label: 任务默认超时（秒）
    io: I
    required: false
    dataBinding: O-SYS 配置
    valueNote: REF-02
  - id: el08
    type: TEXTBOX
    label: 心跳超时阈值（秒）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-03
  - id: el09
    type: TEXTBOX
    label: 引导令牌有效期（秒）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-01
  - id: el10
    type: BUTTON
    label: 保存运行参数（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el11
    type: TEXT
    label: 门面受理 7 日（v1.1）
    io: O
    required: false
    dataBinding: ExecTask 聚合
    valueNote: 来源任务标识非空的任务数，与人工提交量分列（台账事实块）
  - id: el12
    type: TEXT
    label: 痕迹不可存活 LOST（v1.1）
    io: O
    required: false
    dataBinding: ExecTask 聚合
    valueNote: 独立成卡、不并入失败计数（INV-37；与任务成败计数卡视觉分列）
  - id: el13
    type: TEXT
    label: 执行位可用（v1.1）
    io: O
    required: false
    dataBinding: 系统探测（非台账）
    valueNote: 命令面挂载与可执行文件探测结果 + 扫描时间（R-15 的观测侧）；不可用时显示原因，不只置灰
  - id: el14
    type: TEXTBOX
    label: 回执单次回吐行数（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-14
  - id: el15
    type: TEXTBOX
    label: 终止宽限（秒）（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-15；进程组终止链的 SIGTERM→SIGKILL 宽限
  - id: el16
    type: TEXTBOX
    label: 日志保留天数（v1.1）
    io: I
    required: false
    dataBinding: 同左
    valueNote: REF-16；清理由系统执行，界面不提供手工清理位
  - id: el17
    type: TEXT
    label: 执行位命令面挂载路径（v1.1）
    io: O
    required: false
    dataBinding: 部署配置
    valueNote: 只读显示——不在可维护参数内（§1.6.1：部署配置值、运行期不可改）；改它走部署、不走界面
  - id: el18
    type: TEXTBOX
    label: Service 网段（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-17；只校验 CIDR 形态（与节点网络是否重叠属部署侧事实、不校验）；形态不合法即受理拒绝，不静默回落
  - id: el19
    type: TEXTBOX
    label: Pod 网段（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-18；同上，只校验 CIDR 形态
  - id: el20
    type: TEXTBOX
    label: 集群 DNS 后缀（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-19；改写它必须重签访问凭据（服务域名与证书域名形态随之变化）
  - id: el21
    type: TEXTBOX
    label: 容器网络插件（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-20；交付版本登记了插件时以版本登记为准（缺省面被版本派生覆盖）
  - id: el22
    type: TEXTBOX
    label: 容器运行时（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-21；枚举 containerd / docker，枚举外值受理拒绝
  - id: el23
    type: TEXTBOX
    label: 服务代理模式（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-22；枚举 iptables / ipvs / nftables，枚举外值受理拒绝
  - id: el24
    type: TEXTBOX
    label: 节点端口区间（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-23；「起始-结束」形态
  - id: el25
    type: TEXTBOX
    label: 取源方式（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-24；枚举 online / offline，offline 即只用预推与缓存、不出网
  - id: el26
    type: TEXTBOX
    label: 内网镜像仓库地址（v1.1.1）
    io: I
    required: false
    dataBinding: O-SYS 配置项
    valueNote: REF-25；空即不改写仓库相关键（写空串等于把发行包默认仓库覆盖成非法值）
  actions:
  - actionId: act-FUNC-29
    name: 统计总览查询
    actionType: QUERY
    behaviorRef: FUNC-29
    permissionRef:
    - PERM-FUNC-29
  - actionId: act-FUNC-30
    name: 运行参数维护
    actionType: OTHER
    behaviorRef: FUNC-30
    permissionRef:
    - PERM-FUNC-30
# ---- v1.3 批：子域 8「一域两屏」。menu-ign-template / menu-ign-config 各一屏；
#      FUNC-38~44 归模板屏（跨集群取值资产，整组编辑），FUNC-45~49 归配置屏（单集群单轴当前态）。
#      FUNC-50 是 SYSTEM 服务接口（跨中心只读通道），不进 MU、不发菜单。
- screenId: frmIgnTemplate
  name: 参数面模板维护
  screenType: MASTER_DETAIL_FORM
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 文件面
    io: I
    required: true
    dataBinding: IgnParamTemplate.fileFace
    role: QUERY
    valueNote: 字典 IGN_CONFIG_FILE_FACE（两轴，一次一轴）；主表过滤与登记表单同源
  - id: el02
    type: SELECT
    label: 状态
    io: I
    required: false
    dataBinding: IgnParamTemplate.templateStatus
    role: QUERY
    valueNote: 字典 IGN_PARAM_TEMPLATE_STATE；缺省筛除 DISABLED 并提供「显示停用项」开关，已软删行默认可见（不违报表口径 3）
  - id: el03
    type: TEXTBOX
    label: 关键字
    io: I
    required: false
    dataBinding: IgnParamTemplate.templateName
    role: QUERY
    valueNote: 只匹配模板名与编号，不检索字段值内容（REP-15 p4）
  - id: el04
    type: TEXT
    label: 模板编号
    io: O
    required: false
    dataBinding: IgnParamTemplate.templateNo
    dataSource: REP-15
    valueNote: TMP-YYYYMMDD-NNNN，保存时分配、生成后只读
  - id: el05
    type: TEXT
    label: 模板名
    io: O
    required: false
    dataBinding: IgnParamTemplate.templateName
    dataSource: REP-15
    valueNote: 同一文件面内不重名（INV-41 同族面内约束）
  - id: el06
    type: TEXT
    label: 默认徽标
    io: O
    required: false
    dataBinding: IgnParamTemplate.isDefault
    dataSource: REP-15
    valueNote: 只在启用态出现（INV-43）；同文件面至多一行带徽标；对 IGN-ROLE-01 显示为只读徽标 + 原因位「跨集群影响面，由平台运维管理员操作」
  - id: el07
    type: TEXT
    label: 被引用集群数
    io: O
    required: false
    dataBinding: ClusterConfigOverride
    dataSource: REP-15
    valueNote: 反查本域覆写行 + 上游面标识声明（跨域只读标识，INV-33）；点击跳 frmIgnConfig（出处即下一步动作的位置）
  - id: el08
    type: GRID
    label: 从表｜模板字段行（整组编辑，保存提交的是整组 · R-22）
    io: O
    required: false
    dataBinding: ParamTemplateItem
    dataSource: REP-16
    valueNote: 按字段键字典序固定排列（同一面内任何时候同序，否则整组 diff 无法比对）；新增 / 删除行只在整组编辑态可用；无独立 CUD 入口
  - id: el09
    type: SELECT
    label: 字段行：字段键
    io: I
    required: true
    dataBinding: ParamTemplateItem.fieldKey
    valueNote: 合法域 = REF-17~REF-25 面定义（刻意不建字典，面定义改动不需重启界面）；面外键是治理拒绝、不是表单错误（INV-41）；面内不重行
  - id: el10
    type: TEXT
    label: 字段行：值形态
    io: O
    required: false
    dataBinding: ParamTemplateItem.valueShape
    valueNote: 字典 IGN_VALUE_SHAPE（SCALAR / LIST）；随字段键由面定义自动带出，不可人工改
  - id: el11
    type: TEXTBOX
    label: 字段行：值
    io: I
    required: false
    dataBinding: ParamTemplateItem.fieldValue
    valueNote: 单值 → 输入框；列表 → 多行输入（整体替换，无逐行增删控件，R-22）；值一律按口径 1 脱敏显示；可空（空值即让位给下层）
  - id: el12
    type: TEXT
    label: 字段行：让位标记
    io: O
    required: false
    dataBinding: ParamTemplateItem
    dataSource: REP-16
    valueNote: 值为空且该键由版本派生覆盖时显示「让位」，不显示为校验错误
  - id: el13
    type: TEXTBOX
    label: 用途说明
    io: I
    required: false
    dataBinding: IgnParamTemplate.description
    valueNote: 自由文本；不给「看起来一样」的两张模板做区分就只有靠编号猜
  - id: el14
    type: TEXTBOX
    label: 变更事由
    io: I
    required: false
    dataBinding: 动作入参（随 FUNC-41 / 42 / 43 / 44 提交并落审计，不入对象属性）
    valueNote: 启用 / 整组替换 / 设默认 / 软删除四类治理动作均必填（治理资产的动作留痕）
  - id: el15
    type: BUTTON
    label: 保存整组（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el16
    type: BUTTON
    label: 启用 / 停用（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el17
    type: BUTTON
    label: 设为默认（按钮，仅 IGN-ROLE-02 渲染）
    io: I
    required: false
    dataBinding: ''
  - id: el18
    type: BUTTON
    label: 软删除（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el19
    type: TEXT
    label: 启用时间 / 创建时间
    io: O
    required: false
    dataBinding: IgnParamTemplate.enabledAt
    valueNote: enabledAt 首次进入启用态时回填，草稿态为空；createdAt 登记时间（主表按登记时间倒序）
  actions:
  - actionId: act-FUNC-38
    name: 参数面模板列表查询
    actionType: QUERY
    behaviorRef: FUNC-38
    permissionRef:
    - PERM-FUNC-38
  - actionId: act-FUNC-39
    name: 参数面模板详情查询（含字段行整组与被引用出处）
    actionType: QUERY
    behaviorRef: FUNC-39
    permissionRef:
    - PERM-FUNC-39
  - actionId: act-FUNC-40
    name: 参数面模板登记
    actionType: OTHER
    behaviorRef: FUNC-40
    permissionRef:
    - PERM-FUNC-40
  - actionId: act-FUNC-41
    name: 参数面模板字段行整体覆写
    actionType: OTHER
    behaviorRef: FUNC-41
    permissionRef:
    - PERM-FUNC-41
  - actionId: act-FUNC-42
    name: 参数面模板启用 / 停用
    actionType: OTHER
    behaviorRef: FUNC-42
    permissionRef:
    - PERM-FUNC-42
  - actionId: act-FUNC-43
    name: 参数面模板设为默认
    actionType: OTHER
    behaviorRef: FUNC-43
    permissionRef:
    - PERM-FUNC-43
  - actionId: act-FUNC-44
    name: 参数面模板软删除（先返回引用出处再谈可否删）
    actionType: OTHER
    behaviorRef: FUNC-44
    permissionRef:
    - PERM-FUNC-44
- screenId: frmIgnConfig
  name: 集群交付配置台
  screenType: LIST_MAINTENANCE
  layout: ''
  elements:
  - id: el01
    type: REF_SELECT
    label: 集群标识
    io: I
    required: true
    dataBinding: ClusterConfigOverride.clusterRef
    role: QUERY
    valueNote: 跨域引用 O-CLC（INV-33），跳选框；只列本域有交付记录或已登记配置的集群；未选定不出表
  - id: el02
    type: SELECT
    label: 文件面
    io: I
    required: true
    dataBinding: ClusterConfigOverride.fileFace
    role: QUERY
    valueNote: 字典 IGN_CONFIG_FILE_FACE；一次只看一轴，切换轴即整表重载（两轴键域不同，混看会得出错误的「当前值」）
  - id: el03
    type: TEXT
    label: 平台缺省面值（第 4 层地板）
    io: O
    required: false
    dataBinding: REF-17~REF-25 当前值（平台配置）
    dataSource: REP-17
    valueNote: 取数失败显示「不可用 + 原因」（报表口径 2），不以空值代替
  - id: el04
    type: TEXT
    label: 参数面模板值（第 3 层）
    io: O
    required: false
    dataBinding: ParamTemplateItem.fieldValue
    dataSource: REP-17
    valueNote: 面标识为空 ⇒ 该列整列显示「—（未携带面标识，本层跳过）」，不回落到默认模板（R-20）
  - id: el05
    type: TEXT
    label: 交付版本派生值（第 2 层）
    io: O
    required: false
    dataBinding: DeliveryVersion
    dataSource: REP-17
    valueNote: 来自受理时命中版本目录的组件版本组
  - id: el06
    type: TEXT
    label: 覆写值 + 覆写状态 + 事由（第 1 层）
    io: O
    required: false
    dataBinding: ClusterConfigOverride.overrideValue
    dataSource: REP-17
    valueNote: 显示 IGN_OVERRIDE_STATE（生效 / 已回落）与事由
  - id: el07
    type: TEXT
    label: 生效值 + 生效来源徽章
    io: O
    required: false
    dataBinding: R-20 逐字段判定
    dataSource: REP-17
    valueNote: 必现、不得为空；取值为 IGN_PARAM_SOURCE 四值之一（OVERRIDE / VERSION_DERIVED / PARAM_TEMPLATE / PLATFORM_DEFAULT）
  - id: el08
    type: TEXT
    label: 当前落盘
    io: O
    required: false
    dataBinding: 工作目录派生
    dataSource: REP-17
    valueNote: 与「下次将生效」并列两列、不合并；覆写保存成功时本列不刷新（还没派发，刷新它就等于假装生效）
  - id: el09
    type: TEXT
    label: 下次将生效
    io: O
    required: false
    dataBinding: R-20 逐字段判定
    dataSource: REP-17
    valueNote: 清单归属冲突行显示「不渲染」，不给出一个不会用到的值
  - id: el10
    type: TEXT
    label: 应用追溯
    io: O
    required: false
    dataBinding: ClusterConfigOverride.appliedTaskNo
    dataSource: REP-17
    valueNote: appliedTaskNo / appliedAt 由 B-AUTO-15 回填；无值必须显示「未应用」，不给空单元格；可点跳 frmIgnTask 详情
  - id: el11
    type: TEXT
    label: 冲突标注
    io: O
    required: false
    dataBinding: R-18 判定
    dataSource: REP-17
    valueNote: 「已保存 · 未生效（清单归属冲突）」（R-24）—— 由受理侧 R-18 三态判定回吐，界面不自行推断；表头给出「覆写已登记、本次不参与渲染」的原因位
  - id: el12
    type: TEXTBOX
    label: 覆写浮层：新值
    io: I
    required: true
    dataBinding: ClusterConfigOverride.overrideValue
    valueNote: 初值 = 生效值（不是缺省面值，避免用户以为是空值覆盖）；列表值整体替换、无元素级增删控件（R-22）
  - id: el13
    type: TEXTBOX
    label: 覆写浮层：覆写事由
    io: I
    required: true
    dataBinding: ClusterConfigOverride.reason
    valueNote: 必填并落库（与模板动作的事由不同 —— 覆写事由是这条覆写的组成）
  - id: el14
    type: BUTTON
    label: 保存覆写（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el15
    type: BUTTON
    label: 回落为上层取值（按钮，仅对「生效」行渲染）
    io: I
    required: false
    dataBinding: ''
  - id: el16
    type: BUTTON
    label: 配置校验 dry-run（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el17
    type: BUTTON
    label: 查看原文（按钮，独立权限码 · 逐次留痕）
    io: I
    required: false
    dataBinding: ''
  - id: el18
    type: TEXT
    label: 原文只读浮层：带行号整份文本
    io: O
    required: false
    dataBinding: 工作目录派生文件
    dataSource: REP-18
    valueNote: 可复制、不提供导出控件；命中凭据形态整行掩码并在浮层顶部告警计数（过 R-16 同一套识别）；每次打开都重新读、重新审计，关闭不做缓存复用（R-26）
  - id: el19
    type: TEXT
    label: dry-run 结论区
    io: O
    required: false
    dataBinding: R-23 判定
    dataSource: ''
    valueNote: 文案与受理侧同源（同一套校验器，R-23）；五不：不写盘 / 不建任务 / 不占额度 / 不改覆写行 / 不进台账 —— 结论区不出现任务编号、不新增台账行
  actions:
  - actionId: act-FUNC-45
    name: 清单原文只读视图
    actionType: QUERY
    behaviorRef: FUNC-45
    permissionRef:
    - PERM-FUNC-45
  - actionId: act-FUNC-46
    name: 集群交付配置查看（字段级 + 逐字段来源标注）
    actionType: QUERY
    behaviorRef: FUNC-46
    permissionRef:
    - PERM-FUNC-46
  - actionId: act-FUNC-47
    name: 集群交付配置覆写保存
    actionType: OTHER
    behaviorRef: FUNC-47
    permissionRef:
    - PERM-FUNC-47
  - actionId: act-FUNC-48
    name: 集群交付配置校验（dry-run 预检）
    actionType: OTHER
    behaviorRef: FUNC-48
    permissionRef:
    - PERM-FUNC-48
  - actionId: act-FUNC-49
    name: 集群交付配置覆写回落
    actionType: OTHER
    behaviorRef: FUNC-49
    permissionRef:
    - PERM-FUNC-49
