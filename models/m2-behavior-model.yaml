  postconditions:
  - 行集 = ign_task.clusterRef ∪ ign_cluster_config_override.clusterRef 去重（任一侧有记录即入索引；两侧都空 ⇒ 本域不认识该集群）—— 本表列的是「本域服务过的」，不是「存在的」
  - 四个摘要列全部即时派生自两个既有对象的现有关联列：交付记录数（ExecTask 侧计数，含终态）、最近一次交付（taskNo / finishedAt / 结果，LOST 单列不并入失败）、生效覆写字段数（ClusterConfigOverride 生效态计数）、未决偏差数（LOST 与已发生状态修正的任务计数）；**不建新表、不加列、不建统计缓存**（缓存即制造"列表说 3 条、台内只有 2 条"的两张皮）
  - 必须回吐统计时点并在界面标注"摘要截至某时刻，进入台内以台内实时数据为准" —— 派生摘要是结论不是现状，本域没有"该集群现在的状态"这个信息
  - 空态文案是「本域尚未替任何集群执行过交付」，**不得写成「没有集群」**（后者是 O-CLC 的权威事实）
  - 上游集群的名称 / 生命周期状态 / 健康度一律不呈现、不内嵌卡片，需要即跳转（INV-33；本域没有的数据一个字段都不许摆）
  - 与 FUNC-46 不构成"同一报表两个入口"：本查询回答「有哪些集群值得进台」（REP-19 清单），FUNC-46 回答「这一个集群每个字段当前取什么值」（REP-17 明细）
  - 只读、幂等、无写腿：不写本域对象、不产生事件、不改任务状态；反复调用无副作用（本域第 22 个查询功能点，本批唯一新增功能点）
  appliedRules:
