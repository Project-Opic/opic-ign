  ruleType: CROSS_OBJECT
  description: 标量 = 单值替换；列表型 = 整体替换 + 一键回落，界面不提供元素级增删（FUNC-47）；模板字段行同样以整组替换为单位保存（FUNC-41）。判据：元素级编辑要把清单结构搬进对象模型（破 Q-69 裁定②）或维护影子列表（两套事实）；整体替换的代价是多敲几个字符，收益是「台账里的一行 = 落盘后的一项取值」这一条对应关系不破。替换后的值仍须过受理侧形态校验器（R-23）｜写 ClusterConfigOverride.overrideValue / IgnParamTemplate 字段行｜保存即校验
