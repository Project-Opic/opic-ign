- id: R-21
  name: 覆写生效时机与应用追溯回填
  ruleType: CROSS_OBJECT
  description: 覆写保存不重写已落盘文件，只在下一次受理对齐参与渲染（B-AUTO-15）；对齐成功 ⇒ 把真实参与渲染的覆写行回填 appliedTaskNo / appliedAt；回落 ⇒ 置已回落并同时清空这两列（INV-42）。「保存了但还没生效」是常态而不是异常，界面必须把它显示成常态（否则用户会以为改动已落地）—— 本规则与该显示口径是同一件事｜写 ClusterConfigOverride.appliedTaskNo / appliedAt / overrideStatus / rolledBackAt｜例外触发（由受理对齐驱动写入）
