- id: FLOW-PROC-03
  name: 任务分发与结果回流
  flowType: COLLABORATION
  description: 把一个白名单动作安全送到执行位并拿回完整结果（v1.1：LOCAL 为本期执行位，REMOTE 分支保留登记语义但本期不执行；执行事实的结论判定与日志回填均在执行位侧）
  businessObjectRefs:
  - AGG-IGN-06
  - AGG-IGN-03
  roleRefs:
  - IGN-ROLE-01
  trigger:
    triggerType: MANUAL
  preconditions: []
  postconditions:
  - 任务进入终态（含 LOST）且结论依据已留痕；执行机计数与在途互斥口径一致
  startActivity: A01
  endActivities:
  - A03
  - A05
  - A16
  activities:
  - activityId: A01
    name: 提交任务：白名单动作 + 请求令牌（人工 FUNC-23；门面受理走 PROC-06）
    activityType: USER_TASK
    roleRef: IGN-ROLE-01
    behaviorRef: FUNC-23
    nextActivities:
    - A02
  - activityId: A02
    name: 治理校验（白名单与无 shell / 命令面私有映射）
    activityType: GATEWAY
    ruleRef: R-12
    branches:
    - branchName: 白名单外或含拼接风险
      ruleRef: R-12
      targetActivity: A03
    - branchName: 通过
      isDefault: true
      targetActivity: A04
  - activityId: A03
    name: 治理拒绝：403 语义 + 拒绝审计（终止；不是表单校验错误）
    activityType: END
  - activityId: A04
    name: 执行机容量原子校验 + 同集群在途互斥
    activityType: GATEWAY
    ruleRef: R-05
    branches:
    - branchName: 影响 0 行（容量拒绝）
      ruleRef: R-05
      targetActivity: A05
    - branchName: 通过（互斥不满足时照常受理并置 RUNNING，语义为排队中 R-17）
      isDefault: true
      targetActivity: A06
  - activityId: A05
    name: 容量拒绝：不进入队列（终止）
    activityType: END
  - activityId: A06
    name: 登记任务 + 计数递增
    activityType: SYSTEM_TASK
    behaviorRef: FUNC-23
    ruleRef: R-17
    nextActivities:
    - A07
  - activityId: A07
    name: 执行位类型分流
    activityType: GATEWAY
    conditionExpression: Executor.executorType
    branches:
    - branchName: LOCAL（v1.1 本期执行位）
      targetActivity: A08
    - branchName: REMOTE（代理通道，本期不执行）
      targetActivity: A11
  - activityId: A08
    name: 本域后端进程 fork 子进程：独立 argv、无 shell、独立进程组
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-11
    nextActivities:
    - A09
  - activityId: A09
    name: 逐行采集：游标单调入库 + 写前不可逆脱敏
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-11
    ruleRef: INV-38
    nextActivities:
    - A10
  - activityId: A10
    name: 进程退出与结论判定（剧本汇总优先于退出码）
    activityType: GATEWAY
    behaviorRef: B-AUTO-12
    ruleRef: R-14
    branches:
    - branchName: 退出码 / 汇总行给出结论
      isDefault: true
      targetActivity: A13
    - branchName: 取消或超时，宽限终止
      ruleRef: R-14
      targetActivity: A14
    - branchName: 执行痕迹不可验真（PID 不存在）
      ruleRef: R-09
      targetActivity: A15
  - activityId: A11
    name: 域外：mTLS 转发执行机 → 代理 fork → 登记远端任务号
    activityType: SYSTEM_TASK
    behaviorRef: FUNC-23
    nextActivities:
    - A12
  - activityId: A12
    name: 日志中继订阅回流（direction=RELAY）
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-08
    nextActivities:
    - A13
  - activityId: A13
    name: 计数递减 + 终态 + 退出码 / 结论依据留痕
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-12
    ruleRef: INV-37
    nextActivities:
    - A16
  - activityId: A14
    name: 取消链：进程组 SIGTERM → 宽限 REF-15 → SIGKILL，置取消中
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-13
    nextActivities:
    - A13
  - activityId: A15
    name: 显式 LOST + VERDICT_UNRESOLVED + TRACE_LOST（不猜测成功、不伪装成退出码非零）
    activityType: SYSTEM_TASK
    behaviorRef: B-AUTO-14
    ruleRef: INV-37
    nextActivities:
    - A13
  - activityId: A16
    name: 发布任务事件：集群域据此判定交付结果（本域不判定结果）
    activityType: END
