    role: QUERY
  - id: el03
    type: BUTTON
    label: 触发下载（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: BUTTON
    label: 触发预推（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el05
    type: TEXT
    label: 镜像坐标
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el06
    type: TEXT
    label: 摘要
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el07
    type: TEXT
    label: 失败原因
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el08
    type: TEXT
    label: 最近预推时间
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el09
    type: BUTTON
    label: 镜像清单覆写（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-09
    name: 触发镜像预推
    actionType: OTHER
    behaviorRef: FUNC-09
    permissionRef:
    - PERM-FUNC-09
  - actionId: act-FUNC-10
    name: 镜像清单人工覆写
    actionType: OTHER
    behaviorRef: FUNC-10
    permissionRef:
    - PERM-FUNC-10
  - actionId: act-FUNC-11
    name: 预推失败重试（断点续推）
    actionType: OTHER
    behaviorRef: FUNC-11
    permissionRef:
    - PERM-FUNC-11
  - actionId: act-FUNC-12
    name: 预推明细查询
    actionType: QUERY
    behaviorRef: FUNC-12
    permissionRef:
    - PERM-FUNC-12
- screenId: frmIgnExecutor
  name: 执行机操作台
  screenType: SINGLE_FORM
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 治理状态
    io: I
    required: false
    dataBinding: Executor.status
    role: QUERY
  - id: el02
    type: SELECT
    label: 类型
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 注册远程执行机（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 执行机编号
    io: O
    required: false
    dataBinding: Executor
  - id: el05
    type: TEXT
    label: 名称
    io: O
    required: false
    dataBinding: Executor
  - id: el06
    type: TEXT
    label: 类型 ｜ 资产引用
    io: O
    required: false
    dataBinding: Executor.assetRef
  - id: el07
    type: TEXT
    label: 健康（含观测时间）
    io: O
    required: false
    dataBinding: lastHeartbeatAt 派生
  - id: el08
    type: TEXT
    label: 并发
    io: O
    required: false
