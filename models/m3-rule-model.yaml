# ---- v1.2 批（真实例交付验收暴露的登记事实回写）：R-19 交付版本引用的可用性门槛 ----
# 来源 OBS-P3-01（P3 真实例引用的交付版本当时仍为草稿态）；判据与上游 O-CLC 的 REF-05 同口径。
- id: R-19
  name: 交付版本引用的可用性门槛
  ruleType: CROSS_OBJECT
  description: 安装族受理携带的交付版本引用，除「目录内可解析」（INV-33）之外还须命中可交付状态 —— 未归档且就绪及之后（就绪 / 预推中 / 已预推 / 部分预推）；草稿 / 下载中 / 失败 / 已归档 ⇒ 治理拒绝（与 R-12 / R-13 同族，拒绝记录可在「日志与对账」台账查询）。判据：版本状态是组件版本面与镜像清单登记完成的结论（就绪由发行包下载执行 B-AUTO-01 达成），未完成的版本据以派生的交付参数会带着空版本号进装机现场。跨中心可选池（FUNC-08 / REP-03 只给已预推与部分预推）比本门槛更窄，属择优展示而非口径冲突｜读 DeliveryVersion.versionStatus；写治理结论（不建任务行、不占容量）｜提交即强制
