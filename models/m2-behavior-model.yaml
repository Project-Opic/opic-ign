# ---- v1.1 增补：交付门面四件套（FUNC-34~37）与系统自动行为（B-AUTO-01~15）----
# 门面三接口的调用方是**下游中心的服务身份**（非界面用户），故 triggerType=SYSTEM；
# 可追溯门禁只约束 USER_ACTION 行为，FUNC-34/35/36 无界面控件（需求文档 3.2.1「查询类补充说明」）。
- id: FUNC-34
  name: 交付门面 · 任务受理
  ownerEntity: AGG-IGN-06
  behaviorType: COMMAND
  triggerType: SYSTEM
  preconditions:
  - 双重鉴权通过（上游业务权限 + 本域执行权限），服务身份记入 submittedBy
  - 执行动作码命中 IGN_ACTION 白名单且属交付动作层（R-12 / R-13；白名单内但属内部前置层 ezctl.new 或平台运维层 scripts.* 者同样治理拒绝）
  - 本机执行位可用：命令面挂载存在且可执行，否则受理即拒绝并记 TOOL_UNAVAILABLE（R-15，绝不静默改走别的执行位）
  - 节点清单按动作族取用（R-13 解析时校验）：安装族携带全量在册拓扑（地址 + 角色 + 节点名的结构化条目，角色词汇由本域归一）、节点增删类至少一条且可为地址-only、其余动作该字段必须为空；地址 / 角色 / 节点名形态非法或拓扑不满足「至少一个控制面 + 专责组成员数为奇数」⇒ 治理拒绝
  - 安装族可携带交付版本引用：命中版本目录（版本号或名称）即派生组件版本面，引用非空而目录内不可解析 ⇒ 治理拒绝（INV-33 跨域标识必须可解析）；引用非空而版本不在可交付范围（R-19：须未归档且就绪及之后，故草稿 / 下载中 / 失败 / 已归档一律拒绝）⇒ 同样治理拒绝；引用为空 ⇒ 沿用发行包自身版本，本域不猜版本号
  - 【v1.3 批】安装族可携带参数面模板标识（可空）：只递交「用哪张」这一登记标识，不接受模板内容（键值对一律拒绝，R-13 / R-20）；标识非空而本域不可解析或指向非启用态模板 ⇒ 治理拒绝（INV-33：跨域标识必须可解析；R-20：第 3 层只认启用态），绝不静默改用下层取值继续装机；标识为空 ⇒ 回落到该集群接管标记里快照的面标识，快照也没有 ⇒ 该层整体跳过且不回落到默认模板（R-20 分支 H）
  postconditions:
  - 同步返回本域 taskNo 作为远端任务引用（上游据此写 remote_task_ref）；执行本身异步（B-AUTO-11）
  - 安装族受理时该集群的清单与配置已按四层取值（覆写 / 版本派生 / 参数面模板 / 缺省面，R-20）+ 台账拓扑对齐（B-AUTO-15 / R-18：接管 / 幂等 / 冲突三态，每一步核对、首步必须落定），并把真实参与渲染的覆写行回填追溯对（R-21）
  - 同集群存在在途任务时照常受理并置 RUNNING（语义为排队中，R-17），不引入新状态、不判为失败
  appliedRules:
