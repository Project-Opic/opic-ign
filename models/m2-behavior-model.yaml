- id: FUNC-36
  name: 交付门面 · 任务撤销
  ownerEntity: AGG-IGN-06
  behaviorType: COMMAND
  triggerType: SYSTEM
  preconditions:
  - 可撤销范围为 RUNNING / CANCELLING；终态直接返回当前终态（幂等，不报错）
  postconditions:
  - 与 FUNC-24 同一条进程组终止链（R-14）后置「取消中」；最终状态仍由执行事实决定（R-09）
  - 取消不等于回滚：只终止执行，不撤销已产生的副作用
  appliedRules:
