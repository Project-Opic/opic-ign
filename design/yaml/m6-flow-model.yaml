# ---- v1.1 新增：交付门面受理与回执对账（Q-70 裁定 ③ / Q-71 裁定 ④）----
# 域外环节（虚线）：上游 O-CLC 登记 remote_task_ref、轮询回执、按结论写自己的步骤状态——
# 本流程唯一回写对象是本域 ExecTask / TaskLogLine，不写上游任何对象（INV-36 反面）。
- id: FLOW-PROC-06
  name: 交付门面受理与回执对账
  flowType: COLLABORATION
  description: 让上游中心把一次交付步骤交给本域执行，并在断线 / 重启之后仍能拿到权威结论（而不是"没消息"）
  businessObjectRefs:
  - AGG-IGN-06
  - AGG-IGN-03
  roleRefs:
  - IGN-ROLE-05
  trigger:
    triggerType: BEHAVIOR
    behaviorRef: FUNC-34
  preconditions:
  - 双重鉴权通过（上游业务权限 + 本域执行权限），调用方为非人工服务身份
  postconditions:
  - 上游拿到本域任务引用与终态结论（含结论依据）；同集群在途互斥与并发额度口径成立；本域不回写上游对象
  startActivity: A01
  endActivities:
  - A03
  - A05
  - A15
  activities:
  - activityId: A01
    name: 上游受理请求：来源任务 + 来源步骤序号 + 步骤编码（+ 节点地址清单）
    activityType: BEHAVIOR_CALL
    behaviorRef: FUNC-34
    nextActivities:
    - A02
  - activityId: A02
    name: 治理校验（命令面私有映射解析 + 白名单可达面）
    activityType: GATEWAY
    ruleRef: R-13
    branches:
    - branchName: 动作不命中 / 非交付动作层 / 地址非法
      ruleRef: R-12
      targetActivity: A03
    - branchName: 通过
      isDefault: true
      targetActivity: A04
  - activityId: A03
    name: 治理拒绝：403 + 拒绝审计（终止；与人工路径同一口径）
    activityType: END
  - activityId: A04
    name: 执行位可用性与互斥额度判定
    activityType: GATEWAY
    ruleRef: R-15
    branches:
    - branchName: 命令面挂载缺失
      ruleRef: R-15
      targetActivity: A05
    - branchName: 可用
      isDefault: true
      targetActivity: A06
  - activityId: A05
    name: 受理拒绝：TOOL_UNAVAILABLE（终止；绝不静默改走别的执行位）
    activityType: END
  - activityId: A06
    name: 幂等键判定
    activityType: GATEWAY
    ruleRef: INV-35
