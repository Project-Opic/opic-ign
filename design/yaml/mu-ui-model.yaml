    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el06
    type: TEXT
    label: 摘要
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el07
    type: TEXT
    label: 失败原因
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el08
    type: TEXT
