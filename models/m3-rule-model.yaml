# ---- v1.3 批（易用性 / 管理员体验增补，需求文档 3.3.1 / 3.3.3）：REF-26 + INV-41~43 + R-20~R-26 ----
# 分层对账（需求文档 3.3.4）：面内键合法域 = 同对象内部 + 配置定义 ⇒ INV-41（同时约束模板行与覆写行，只建一条）；
# 默认唯一 = 同对象跨行 ⇒ INV-43；覆写坐标唯一与追溯对清空 = 同对象内部 ⇒ INV-42；
# 跨对象（模板值进不进渲染 / 覆写何时算生效 / 被引用能不能删）⇒ R-20 / R-21 / R-25。
# 四层优先级本身不建第 27 条 R —— 它就是 R-20；REF-17~25 继续只管单键取值与形态。
- id: REF-26
  name: 界面日志自动跟随的读取间隔取平台配置
  ruleType: FORMAT
  description: 缺省 2 秒，允许区间 2~3 秒；只影响界面刷新节奏，不影响游标语义与数据完整性（游标增量读取本身由 REF-14 的行数上限约束）。是界面节奏参数、不属参数面 —— 不进 INV-41 的合法键集合
  expression: 「任务桥接 / 日志与对账」屏的自动跟随基准（FUNC-27 / REP-11）
  reusedBy: []
  version: '1.3'
- id: INV-41
  name: 参数面字段键必须落在面定义内
  ruleType: INVARIANT
  description: 参数面模板字段行与集群交付配置覆写行的字段键必须落在 REF-17~REF-25 定义的参数面内；面外键一律拒绝（保存即校验）。判据：面外键一旦入库，本域就有了「台账里管着一批没人校验的命令面参数」的死角 —— 命令面私有（R-13）会从这儿漏。本条同时约束两个新对象，两侧共用一套面定义、不重复建 INV
  expression: 
  reusedBy: []
  version: '1.3'
- id: INV-42
  name: 覆写坐标唯一且回落即清空追溯对
  ruleType: INVARIANT
  description: 同一「集群标识 + 文件面 + 字段键」在本域至多一条覆写记录（天然坐标唯一，保存即校验）；overrideStatus = 已回落时 appliedTaskNo / appliedAt 必须为空 —— 回落即清空追溯对（仅提交时强制校验）。判据：留着旧的「已应用」对，界面上就分不清「曾经生效过」与「现在正生效」，而运维看的是后者
  expression: 
  reusedBy: []
  version: '1.3'
- id: INV-43
  name: 同文件面默认模板至多一条且须启用
  ruleType: INVARIANT
  description: 同一文件面内 isDefault 为真的模板至多一条，且默认模板必须处于启用态；停用 / 删除默认模板必须先取消默认或改指（保存即校验）。界面侧投影：默认徽标只在启用态出现（REP-15 口径注记）
  expression: 
  reusedBy: []
  version: '1.3'
- id: R-20
  name: 参数面四层取值优先级与逐字段来源标注
  ruleType: CROSS_OBJECT
  description: 某集群某字段的最终取值 = 按「集群交付配置覆写（生效态）> 交付版本派生（请求体版本引用命中目录）> 参数面模板（请求体携带的面标识命中本域启用态模板）> 平台缺省面（REF-17~25）」四层逐字段取最高优先命中。面标识是登记标识、不是参数内容 —— 上游只递交「用哪张模板」（R-13 本批增补口径），模板字段行仍在本域解析；面标识为空 ⇒ 该层整体跳过（不回落到默认模板：默认标记只服务上游选择器的缺省值、不参与渲染，否则改一次默认模板会让所有未指定模板的存量集群下次装机参数静默漂移）。上层缺该键即自然落到下层（不是整层替换，也不做层间合并 —— 列表型字段是整体替换，R-22）。每一次渲染必须能逐字段给出生效来源（IGN_PARAM_SOURCE 四值之一）—— 只有最终值、没有来源的配置视图不解决问题：运维要判断的是「我该改哪一层」。优先级次序固定、不可配置、不随文件面变化（可配次序会让两块屏对同一集群给出不同解释）｜读 ClusterConfigOverride / IgnParamTemplate / DeliveryVersion / 平台配置；写集群交付配置的渲染结果｜提交即强制（B-AUTO-15）+ 查看即时计算（FUNC-46）
  expression: 某集群某字段的最终取值 = 按「集群交付配置覆写（生效态）> 交付版本派生（请求体版本引用命中目录）> 参数面模板（请求体携带的面标识命中本域启用态模板）> 平台缺省面（REF-17~25）」四层逐字段取最高优先命中。面标识是登记标识、不是参数内容 —— 上游只递交「用哪张模板」（R-13 本批增补口径），模板字段行仍在本域解析；面标识为空 ⇒ 该层整体跳过（不回落到默认模板：默认标记只服务上游选择器的缺省值、不参与渲染，否则改一次默认模板会让所有未指定模板的存量集群下次装机参数静默漂移）。上层缺该键即自然落到下层（不是整层替换，也不做层间合并 —— 列表型字段是整体替换，R-22）。每一次渲染必须能逐字段给出生效来源（IGN_PARAM_SOURCE 四值之一）—— 只有最终值、没有来源的配置视图不解决问题：运维要判断的是「我该改哪一层」。优先级次序固定、不可配置、不随文件面变化（可配次序会让两块屏对同一集群给出不同解释）｜读 ClusterConfigOverride / IgnParamTemplate / DeliveryVersion / 平台配置；写集群交付配置的渲染结果｜提交即强制（B-AUTO-15）+ 查看即时计算（FUNC-46）
