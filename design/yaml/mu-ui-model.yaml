model_type: UI
version: '1.5'
domain: 交付执行域
application:
  name: OPIC-交付执行域
  menus:
  # v1.5 载体置换（Q-129 / Q-133 / Q-134）：两级九叶 → 一级五叶、0 二级；归堆判据 = 共享同一份主对象 / 同一条操作轴，不是「业务相近」。
  # 五个退出侧栏的屏（image / template / tls / log / config）一字不动地转入 retiredMenus，其元素表与权限档不变。
  - menuId: menu-ign-cluster
    name: 集群交付
    screenRef: frmIgnClusterIndex
    route: /ign/cluster
    note: v1.5 新增一级叶，本域工作起点（Q-127）—— 回答「本域替哪些集群跑过交付、此刻有没有待我处理的」；行操作「进入集群交付台」进宿主屏（非菜单项）
  - menuId: menu-ign-version
    name: 交付资产
    screenRef: frmIgnVersion
    route: /ign/version
    note: v1.5 由「交付管理 › 版本目录」二级叶升为一级叶并就地升格为宿主屏（Q-133）：版本目录 ｜ 发行包与镜像 ｜ 参数面模板三签，都回答「这次交付什么」
  - menuId: menu-ign-executor
    name: 执行位
    screenRef: frmIgnExecutor
    route: /ign/executor
    note: v1.5 升为一级叶并就地升格为宿主屏（Q-133）：执行机 ｜ 通道安全两签，都挂在同一个执行位对象上
  - menuId: menu-ign-task
    name: 交付任务
    screenRef: frmIgnTask
    route: /ign/task
    note: v1.5 升为一级叶并就地升格为宿主屏（Q-133）：任务台账 ｜ 日志与对账两签 = 横看形态（跨集群）；台内的「任务」页签是同一屏的第二挂点（嵌入态带 clusterRef）
  - menuId: menu-ign-ops
    name: 运行观测
    screenRef: frmIgnOps
    route: /ign/ops
    note: v1.5 由二级升为一级叶，单屏无页签（它本来就是跨集群的观测面，与任何单集群的一生无关）
  retiredMenus:
  - menuId: menu-ign-image
    name: 发行包与镜像
    screenRef: frmIgnImage
    landedTab: 发行包与镜像
    landedHost: frmIgnVersion
  - menuId: menu-ign-template
    name: 参数面模板
    screenRef: frmIgnTemplate
    landedTab: 参数面模板
    landedHost: frmIgnVersion
  - menuId: menu-ign-tls
    name: 通道安全
    screenRef: frmIgnTls
    landedTab: 通道安全
    landedHost: frmIgnExecutor
  - menuId: menu-ign-log
    name: 日志与对账
    screenRef: frmIgnLog
    landedTab: 日志与对账
    landedHost: frmIgnTask ｜ frmIgnClusterConsole（一屏两宿主，本域唯一）
  - menuId: menu-ign-config
    name: 集群交付配置
    screenRef: frmIgnConfig
    landedTab: 配置
    landedHost: frmIgnClusterConsole
  retiredGroups:
  - menuId: menu-l1-01
    name: 交付管理
    note: 一级分组节点撤销（其八个二级叶各自归入四个一级叶或退出侧栏）；库侧置不可见、非物理删除
  - menuId: menu-l1-02
    name: 运行观测（分组节点）
    note: 分组节点撤销，其唯一子叶 menu-ign-ops 升为一级叶同名
  routeRetirements:
  - from: /ign/image
    to: /ign/version?tab=image
  - from: /ign/template
    to: /ign/version?tab=template
  - from: /ign/tls
    to: /ign/executor?tab=tls
  - from: /ign/log
    to: /ign/task?tab=log
  - from: /ign/config
    to: /ign/cluster
  menuNote: v1.5 载体置换（Q-129 / Q-133 / Q-134）—— 侧栏 2 一级分组 / 9 二级 → 5 个一级叶 / 0 二级；五叶退出侧栏但屏定义与元素表一字不动，登记单位由「菜单叶」变「宿主屏页签」；集群台走深链 /ign/console/:clusterRef（非菜单项）；五条旧路由全部保留为带上下文参数的重定向（收藏夹与上游跳转不得变 404），兼容一版、下一版移除；库侧 sys_menu 旧行置不可见而非物理删除
screens:
- screenId: frmIgnVersion
  name: 版本列表维护
  screenType: LIST_MAINTENANCE
  entryNote: v1.5 就地升格为宿主屏（Q-129 / Q-133）—— 侧栏「交付资产」一级叶的页签组以本屏为主体（列表维护形态保持整屏宽度），三签＝「版本目录 ｜ 发行包与镜像 ｜ 参数面模板」；另两签分别挂载 frmIgnImage、frmIgnTemplate 的既有屏定义，三签各自独立取数、各自独立保存，切换页签不共享表单状态（9.1 载体注记）
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 编排引擎版本
    io: I
    required: false
    dataBinding: DeliveryVersion.orchestratorVersion
  - id: el02
    type: SELECT
    label: 版本状态
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 版本登记（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 版本编号
    io: O
    required: false
    dataBinding: DeliveryVersion
  - id: el05
    type: TEXT
    label: 版本名
    io: O
    required: false
    dataBinding: DeliveryVersion
  - id: el06
    type: TEXT
    label: 组件版本组（契约，上架后冻结）
    io: O
    required: false
    dataBinding: 组件版本组六项
  - id: el07
    type: TEXT
    label: 预推汇总
    io: O
    required: false
    dataBinding: ImagePrepushItem 聚合
  - id: el08
    type: BUTTON
    label: 断点续推（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-01
    name: 版本登记
    actionType: OTHER
    behaviorRef: FUNC-01
    permissionRef:
    - PERM-FUNC-01
  - actionId: act-FUNC-02
    name: 版本登记信息修改
    actionType: OTHER
    behaviorRef: FUNC-02
    permissionRef:
    - PERM-FUNC-02
  - actionId: act-FUNC-03
    name: 触发发行包下载
    actionType: OTHER
    behaviorRef: FUNC-03
    permissionRef:
    - PERM-FUNC-03
  - actionId: act-FUNC-04
    name: 版本归档
    actionType: OTHER
    behaviorRef: FUNC-04
    permissionRef:
    - PERM-FUNC-04
  - actionId: act-FUNC-05
    name: 版本软删除
    actionType: OTHER
    behaviorRef: FUNC-05
    permissionRef:
    - PERM-FUNC-05
  - actionId: act-FUNC-06
    name: 版本列表查询
    actionType: QUERY
    behaviorRef: FUNC-06
    permissionRef:
    - PERM-FUNC-06
  - actionId: act-FUNC-07
    name: 版本详情查询（含镜像清单与预推状态）
    actionType: QUERY
    behaviorRef: FUNC-07
    permissionRef:
    - PERM-FUNC-07
- screenId: frmIgnImage
  name: 发行包与预推台
  screenType: LIST_MAINTENANCE
  hostedIn: frmIgnVersion
  tabName: 发行包与镜像
  carrierNote: v1.5 载体置换（Q-129）—— 退出侧栏二级叶、屏定义与元素表一字未动，转为「交付资产」叶的「发行包与镜像」页签主体；嵌入态下顶部版本筛选器照常保留（发行包与预推必须以“选了哪个版本”为前提，本屏不是某集群的从属视图，与 frmIgnConfig 的嵌入态处理不同）（9.2 载体注记）
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 版本
    io: I
    required: false
    dataBinding: DeliveryVersion
  - id: el02
    type: SELECT
    label: 预推状态
    io: I
    required: false
    dataBinding: ImagePrepushItem.prepushStatus
    role: QUERY
  - id: el03
    type: BUTTON
    label: 触发下载（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: BUTTON
    label: 触发预推（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el05
    type: TEXT
    label: 镜像坐标
    io: O
    required: false
    dataBinding: ImagePrepushItem
  - id: el06
