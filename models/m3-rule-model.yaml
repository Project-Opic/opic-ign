  description: 缺省空；**空即不改写仓库相关键** —— 写空串等于把发行包默认仓库覆盖成非法值；非空时参与执行位的代理例外清单（该仓库 host 不走代理）
  expression: B-AUTO-15 交付配置仓库键落盘基准
