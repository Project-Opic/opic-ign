- screenId: frmIgnTls
  name: 通道安全台
  screenType: LIST_MAINTENANCE
  hostedIn: frmIgnExecutor
  tabName: 通道安全
  carrierNote: v1.5 载体置换（Q-129）—— 退出侧栏二级叶、屏定义与元素表一字未动，转为「执行位」叶的「通道安全」页签主体；IGN-ROLE-04 下该页签不渲染（8.3.2），其三个功能点 FUNC-20~22 在矩阵二对该列本就全为 —，即页签隐藏与权限档位是同一件事的两个说法、不是两处独立判断（9.4 载体注记）
  layout: ''
  elements:
  - id: el01
    type: TEXTBOX
    label: 执行机
    io: I
    required: false
    dataBinding: ExecutorTlsBinding.executorRef
  - id: el02
    type: SELECT
    label: 证书用途
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: BUTTON
    label: 临期视图（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el04
    type: TEXT
    label: 绑定编号
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el05
    type: TEXT
    label: 生效止
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el06
    type: TEXT
    label: 状态
    io: O
    required: false
    dataBinding: ExecutorTlsBinding
  - id: el07
    type: TEXT
    label: 凭据标识（跳转证书域）
    io: O
    required: false
    dataBinding: ExecutorTlsBinding.certRef
  - id: el08
    type: TEXT
    label: 剩余天数（即时计算）
    io: O
    required: false
    dataBinding: notAfter 派生
  - id: el09
    type: TEXT
    label: TLS 已禁用（红标）
    io: O
    required: false
    dataBinding: Executor 降级声明
  - id: el10
    type: BUTTON
    label: 手动触发续期（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-20
    name: 手动触发证书续期
    actionType: OTHER
    behaviorRef: FUNC-20
    permissionRef:
    - PERM-FUNC-20
  - actionId: act-FUNC-21
